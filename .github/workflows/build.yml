name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- Windows (supported; publishes the release)
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MinGW-w64 (UCRT): wxWidgets and the Rust "gnu" toolchain the project is pinned to (rust-toolchain.toml).
      - name: Install MinGW (UCRT)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Toolchain environment
        run: |
          echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\gcc.exe" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Rust (gnu toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc --version
          g++ --version | Select-Object -First 1

      - name: Install NSIS (installer)
        run: choco install nsis -y --no-progress

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: old-src/package-lock.json

      # wxWidgets is built from source by wxdragon-sys: keep the result between runs.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            wx/target
          key: cargo-windows-${{ hashFiles('Cargo.lock', 'wx/Cargo.lock', 'rust-toolchain.toml', 'vendor/wxdragon-sys/build.rs', 'wx/.cargo/config.toml') }}
          restore-keys: cargo-windows-

      - name: Assets (Mermaid, whiteboard)
        run: node scripts/setup-assets.js

      - name: Test (portable core)
        run: cargo test --workspace --locked

      - name: Test (whiteboard tree)
        run: node --test whiteboard/tree/model.test.js

      - name: Package
        run: ./scripts/package.ps1

      - name: Release files (zip + checksum)
        run: ./scripts/release.ps1

      - name: Installer + update manifest (latest.yml)
        run: ./scripts/installer.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NotePP-windows-x64
          path: dist/release/*
          if-no-files-found: error

      - name: Tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ver = (Select-String Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -ne $tag) { throw "Tag ${{ github.ref_name }} does not match version $ver in Cargo.toml" }

      - name: Sign the update
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          cargo run --locked -p notepp-core --example update_key -- sign $ver dist/release/NotePP-windows-x64.zip.sha256 dist/release/NotePP-windows-x64.zip.sha256.sig
          if ($LASTEXITCODE -ne 0) { throw 'Signing the update failed' }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          # zip + checksum + signature: the in-app updater; installer + latest.yml: the updater of the 1.x app
          $files = @('dist/release/NotePP-windows-x64.zip', 'dist/release/NotePP-windows-x64.zip.sha256', 'dist/release/NotePP-windows-x64.zip.sha256.sig', "dist/release/NotePP-Setup-$ver.exe", 'dist/release/latest.yml')
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Note++ $ver" --generate-notes $files
          } else {
            gh release upload $tag $files --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed' }

  # ---------------------------------------------------------------- known vulnerabilities in dependencies
  # Reports only: an advisory shows up here without blocking a release.
  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      # rust-toolchain.toml names the Windows toolchain, which cannot run here. The audit only reads the lockfiles.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Core
        run: cargo audit

      - name: Shell
        if: always()
        working-directory: wx
        run: cargo audit

  # ---------------------------------------------------------------- Linux and macOS (experimental)
  # Built by the same wxWidgets shell, but not yet tested on those systems. A failure here never blocks the
  # Windows release; the files are added to the release when the build works.
  unix:
    name: ${{ matrix.name }} (experimental)
    needs: windows
    # On tags, and on a manual run (to try these builds without publishing anything).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-22.04, target: linux-x64 }
          - { name: macOS Apple Silicon, os: macos-15, target: macos-arm64 }
    env:
      # rust-toolchain.toml pins the Windows toolchain; use the host one here.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libclang-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libx11-dev

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: old-src/package-lock.json

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wx/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('wx/Cargo.lock', 'vendor/wxdragon-sys/build.rs') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Assets (Mermaid, whiteboard)
        run: node scripts/setup-assets.js

      - name: Build
        working-directory: wx
        run: cargo build -p notepp-wx --release --locked

      - name: Package
        run: bash scripts/package-unix.sh ${{ matrix.target }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NotePP-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/release/NotePP-${{ matrix.target }}.* --clobber
