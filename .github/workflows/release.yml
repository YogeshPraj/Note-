name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build AND publish via electron-builder so the auto-updater manifest
      # (latest.yml) and *.blockmap files end up on the GitHub release.
      # electron-updater requires latest.yml — without it, auto-update silently
      # fails to find new versions.
      - name: Build & Publish Installer
        run: npm run build:wb && npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/Note++-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
