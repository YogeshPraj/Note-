[workspace]
members = ["crates/core"]
# The wxWidgets shell is a separate workspace: they need a different compiler (see wx/README.md).
exclude = ["wx", "vendor"]

[workspace.package]
version = "2.0.1"

# Key derivation is slow unoptimised; keep the tests quick.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
