[workspace]
resolver = "3"
members = ["crates/core"]
# The wxWidgets shell is a separate workspace: they need a different compiler (see wx/README.md).
exclude = ["wx", "vendor"]

[workspace.package]
version = "2.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
too_many_lines = "warn"
# Style lints that cost more than they give here (decision logged in docs/decisions.md).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
assert_is_empty = "allow"
trivially_copy_pass_by_ref = "allow"
wildcard_imports = "allow"
format_push_string = "allow"
many_single_char_names = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Key derivation is slow unoptimised; keep the tests quick.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3

# AV1 encoding (AVIF) is far too slow unoptimised.
[profile.dev.package.rav1e]
opt-level = 3
[profile.dev.package.ravif]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
