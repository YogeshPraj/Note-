<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root { --bg:#f0f0f0; --fg:#1b1b1b; --bar:#f0f0f0; --barborder:#c8c8c8; --btn:#dedede; --on:#cfe0f7; --onborder:#5b9be0; --stage:#f0f0f0; --muted:#666; --h1:#38c; }
body.dark { --bg:#1e1e1e; --fg:#d4d4d4; --bar:#2b2b2b; --barborder:#444; --btn:#444; --on:#2f4f78; --onborder:#4d8fd9; --stage:#252526; --muted:#9da5ae; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:12px "Segoe UI", system-ui, sans-serif; overflow:hidden; user-select:none; }
#top { position:absolute; left:0; right:0; top:0; background:var(--bar); border-bottom:1px solid var(--barborder); }
.row { display:flex; align-items:center; gap:2px; padding:3px 6px; min-height:30px; flex-wrap:wrap; }
.sep { width:1px; height:20px; background:var(--barborder); margin:0 4px; }
button { height:24px; min-width:24px; padding:0 6px; border:1px solid transparent; border-radius:3px; background:transparent; color:var(--fg); font:inherit; cursor:pointer; }
button:hover:not(:disabled) { background:var(--btn); }
button:disabled { opacity:.4; cursor:default; }
button.on { background:var(--on); border-color:var(--onborder); }
label { display:inline-flex; align-items:center; gap:4px; margin-right:6px; color:var(--fg); }
input[type=color] { width:26px; height:22px; padding:0; border:1px solid var(--barborder); border-radius:3px; background:transparent; cursor:pointer; }
input[type=number] { width:54px; height:22px; border:1px solid var(--barborder); border-radius:3px; background:var(--bg); color:var(--fg); font:inherit; }
#left { position:absolute; left:0; width:34px; top:var(--toph, 64px); bottom:22px; background:var(--bar); border-right:1px solid var(--barborder); padding:4px 3px; display:flex; flex-direction:column; align-items:center; gap:1px; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
#left::-webkit-scrollbar { display:none; }
#left button { width:26px; height:26px; min-width:26px; flex:none; padding:0; display:flex; align-items:center; justify-content:center; }
#left svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
#left .gap { height:4px; flex:none; }
#view { position:absolute; left:34px; right:0; top:var(--toph, 64px); bottom:22px; overflow:auto; background:var(--stage); }
#stage { position:relative; margin:16px; width:max-content; height:max-content; background-color:#fff; background-image:conic-gradient(#d9d9d9 25%, #fff 0 50%, #d9d9d9 0 75%, #fff 0); background-size:16px 16px; box-shadow:0 1px 6px rgba(0,0,0,.35); }
#pic, #ov { display:block; }
#ov { position:absolute; left:0; top:0; }
#pic.crisp { image-rendering:pixelated; }
#status { position:absolute; left:0; right:0; bottom:0; height:22px; padding:3px 10px; font-size:12px; color:var(--muted); background:var(--bar); border-top:1px solid var(--barborder); white-space:nowrap; overflow:hidden; }
#cropbar { position:absolute; display:none; gap:4px; padding:4px; background:var(--bar); border:1px solid var(--barborder); border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.35); z-index:5; }
#resize { position:absolute; display:none; top:80px; left:50%; transform:translateX(-50%); padding:12px 14px; background:var(--bar); border:1px solid var(--barborder); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.4); z-index:6; }
#resize label { display:flex; margin:4px 0; }
#resize input[type=number] { width:90px; }
#resize .row { justify-content:flex-end; padding:8px 0 0; }
#textbox { position:absolute; display:none; margin:0; padding:0 2px; border:1px dashed #888; background:rgba(255,255,255,.6); outline:none; resize:none; overflow:hidden; font-family:"Segoe UI", sans-serif; line-height:1.25; z-index:4; min-width:40px; white-space:pre; }
.hidden { display:none !important; }
.ch { position:absolute; width:7px; height:7px; margin:-3.5px 0 0 -3.5px; background:#fff; border:1px solid #222; z-index:3; display:none; }
#newsize { position:absolute; display:none; border:1px dashed #1e88e5; background:rgba(30,136,229,.08); pointer-events:none; z-index:2; }
</style>
</head>
<body>
<div id="top">
  <div class="row">
    <button id="save" title="Save (Ctrl+S)">Save</button>
    <button id="copy" title="Copy the picture to the clipboard (Ctrl+C)">Copy</button>
    <span class="sep"></span>
    <button id="undo" title="Undo (Ctrl+Z)">&#8630;</button>
    <button id="redo" title="Redo (Ctrl+Y)">&#8631;</button>
    <button id="del" title="Delete the selected object (Delete)">Delete</button>
    <button id="center" title="Centre the picture on the canvas (or drag the picture with Select)">Centre</button>
    <span class="sep"></span>
    <button id="zout" title="Zoom out">&minus;</button>
    <button id="zlabel" title="Actual size (100%)">100%</button>
    <button id="zin" title="Zoom in">+</button>
    <button id="zfit" title="Fit to the window">Fit</button>
  </div>
  <div class="row" id="props">
    <label title="Fill colour">Fill <input id="fill" type="color" value="#ffffff"><input id="nofill" type="checkbox" checked title="No fill"> none</label>
    <label title="Line colour">Line <input id="line" type="color" value="#e53935"></label>
    <label title="Line thickness (block size for Hide)">Line thickness <input id="thick" type="number" min="1" max="60" value="3"></label>
    <label title="Text size">Text size <input id="fsize" type="number" min="8" max="200" value="22"></label>
  </div>
</div>
<div id="left"></div>
<div id="view"><div id="stage"><canvas id="pic"></canvas><canvas id="ov"></canvas><div id="newsize"></div><textarea id="textbox" rows="1" spellcheck="false"></textarea></div></div>
<div id="cropbar"><button id="cropok">Apply</button><button id="cropno">Cancel</button></div>
<div id="resize">
  <label>Width <input id="rw" type="number" min="1" max="16000"> px</label>
  <label>Height <input id="rh" type="number" min="1" max="16000"> px</label>
  <label><input id="rlock" type="checkbox" checked> Keep proportions</label>
  <div class="row"><button id="rok">Resize</button><button id="rno">Cancel</button></div>
</div>
<div id="status">No picture</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var post = function (m) { window.ipc.postMessage(m); };
  var pic = $('pic'), pctx = pic.getContext('2d', { willReadFrequently: true });
  var ov = $('ov'), octx = ov.getContext('2d');
  var base = document.createElement('canvas');                    // the picture itself; replaced, never drawn on
  var objects = [], sel = null, tool = 'select', zoom = 1, fitMode = true, loaded = false;
  var undoStack = [], redoStack = [], crop = null, stateTimer = 0, dragging = false;
  var photo = { x: 0, y: 0, w: 0, h: 0 };                         // where the original picture sits on the canvas
  var style = { line: '#e53935', fill: null, w: 3, fs: 22 };

  /* ---- icons for the tool bar (drawn here, 24 x 24) ---- */
  var ICONS = {
    select: '<path d="M6 3l12 8-5.2 1.3L15.5 19l-2.6 1-2.7-6.6L6 17z"/>',
    rect: '<rect x="4" y="6" width="16" height="12" rx="1"/>',
    oval: '<ellipse cx="12" cy="12" rx="8.5" ry="6.5"/>',
    line: '<path d="M4 20L20 4"/>',
    arrow: '<path d="M4 20L19 5M10 5h9v9"/>',
    free: '<path d="M3 16c3-9 6-9 8-3s5 6 10-6"/>',
    text: '<path d="M6 6h12M12 6v13M9 19h6"/>',
    bubble: '<path d="M5 4h14a1 1 0 011 1v9a1 1 0 01-1 1h-7l-4 4.5V15H5a1 1 0 01-1-1V5a1 1 0 011-1z"/>',
    step: '<circle cx="12" cy="12" r="8.5"/><path d="M10 10l2.3-1.8v7.8"/>',
    highlight: '<rect x="4" y="15" width="16" height="5" fill="currentColor" fill-opacity=".35" stroke="none"/><path d="M8 14l6-9 3.2 2.2-5.6 8.6z"/>',
    hide: '<path d="M4 4h5v5H4zM14 4h5v5h-5zM9 9h5v5H9zM4 14h5v5H4zM14 14h5v5h-5z" fill="currentColor" fill-opacity=".4"/>',
    crop: '<path d="M7 2v15h15M2 7h15v15"/>',
    rotl: '<path d="M4 9a8 8 0 112 8M4 3v6h6"/>',
    rotr: '<path d="M20 9a8 8 0 10-2 8M20 3v6h-6"/>',
    fliph: '<path d="M12 3v18M8 7l-5 5 5 5zM16 7l5 5-5 5z"/>',
    flipv: '<path d="M3 12h18M7 8l5-5 5 5zM7 16l5 5 5-5z"/>',
    resz: '<path d="M4 4h11v11H4zM15 15h5v5h-5zM9 9l8 8"/>'
  };
  var TOOLS = [
    ['select', 'Select (move, resize and edit objects)'], ['rect', 'Rectangle'], ['oval', 'Ellipse'], ['line', 'Line'], ['arrow', 'Arrow'], ['free', 'Freehand'],
    ['text', 'Text'], ['bubble', 'Speech bubble'], ['step', 'Step label (numbered)'], ['highlight', 'Highlight'], ['hide', 'Hide: pixelate a rectangle'], null,
    ['crop', 'Crop: drag a rectangle, then Enter or Apply'], ['rotl', 'Rotate left'], ['rotr', 'Rotate right'], ['fliph', 'Flip horizontally'], ['flipv', 'Flip vertically'], ['resz', 'Resize the picture']
  ];
  var DRAW = { rect: 1, oval: 1, line: 1, arrow: 1, free: 1, text: 1, bubble: 1, step: 1, highlight: 1, hide: 1, crop: 1 };
  TOOLS.forEach(function (t) {
    if (!t) { var g = document.createElement('div'); g.className = 'gap'; $('left').appendChild(g); return; }
    var b = document.createElement('button'); b.setAttribute('data-tool', t[0]); b.title = t[1];
    b.innerHTML = '<svg viewBox="0 0 24 24">' + ICONS[t[0]] + '</svg>';
    b.onclick = function () { choose(t[0]); };
    $('left').appendChild(b);
  });

  /* ---- keys the window owns (the page has the keyboard, so the window never sees them) ---- */
  window.addEventListener('keydown', function (e) {
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT');
    if (e.key === 'Tab' && e.ctrlKey && !e.altKey) { e.preventDefault(); e.stopPropagation(); post(e.shiftKey ? 'tab:prev' : 'tab:next'); return; }
    if ((e.altKey && !e.ctrlKey && /^[a-z0-9]$/i.test(e.key)) || (e.key === 'F10' && !e.altKey && !e.ctrlKey && !e.shiftKey)) { e.preventDefault(); e.stopPropagation(); post('menu:' + (e.key === 'F10' ? '' : e.key)); return; }
    if (e.target && e.target.id === 'textbox') return;
    if (e.ctrlKey && !e.altKey && !typing) {
      var k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
      else if (k === 's') { e.preventDefault(); save(); }
      else if (k === 'c') { e.preventDefault(); copyImage(); }
    } else if (e.key === 'Enter' && crop && !typing) { e.preventDefault(); applyCrop(); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && !typing) { e.preventDefault(); removeSelected(); }
    else if (e.key === 'Escape') { cancelCrop(); select(null); $('resize').style.display = 'none'; }
  }, true);

  /* ---- drawing the objects ---- */
  function lineW(o) { return Math.max(0, o.w); }
  function fontOf(o) { return o.fs + 'px "Segoe UI", system-ui, sans-serif'; }
  function textLines(o) { return String(o.text || '').split('\n'); }
  function textSize(o) {
    pctx.font = fontOf(o); var w = 0, lines = textLines(o);
    lines.forEach(function (l) { w = Math.max(w, pctx.measureText(l).width); });
    return { w: Math.max(8, w), h: lines.length * o.fs * 1.25 };
  }
  function box(o) {
    if (o.t === 'text') { var s = textSize(o); return { x: o.x1, y: o.y1, w: s.w, h: s.h }; }
    if (o.t === 'step') { var r = o.fs * 0.9; return { x: o.x1 - r, y: o.y1 - r, w: 2 * r, h: 2 * r }; }
    if (o.t === 'free') {
      var xs = o.pts.map(function (p) { return p.x; }), ys = o.pts.map(function (p) { return p.y; });
      var x = Math.min.apply(null, xs), y = Math.min.apply(null, ys); return { x: x, y: y, w: Math.max.apply(null, xs) - x, h: Math.max.apply(null, ys) - y };
    }
    var x1 = Math.min(o.x1, o.x2), y1 = Math.min(o.y1, o.y2); return { x: x1, y: y1, w: Math.abs(o.x2 - o.x1), h: Math.abs(o.y2 - o.y1) };
  }
  function arrowHead(g, o) {
    var ang = Math.atan2(o.y2 - o.y1, o.x2 - o.x1), head = Math.max(12, o.w * 4);
    g.beginPath(); g.moveTo(o.x2, o.y2);
    g.lineTo(o.x2 - head * Math.cos(ang - 0.45), o.y2 - head * Math.sin(ang - 0.45));
    g.lineTo(o.x2 - head * Math.cos(ang + 0.45), o.y2 - head * Math.sin(ang + 0.45));
    g.closePath(); g.fill();
  }
  function pixelate(g, b, size) {
    var x = Math.max(0, Math.round(b.x)), y = Math.max(0, Math.round(b.y));
    var w = Math.min(pic.width - x, Math.round(b.w)), h = Math.min(pic.height - y, Math.round(b.h));
    if (w < 2 || h < 2) return;
    var block = Math.max(4, size), sw = Math.max(1, Math.round(w / block)), sh = Math.max(1, Math.round(h / block));
    var small = document.createElement('canvas'); small.width = sw; small.height = sh;
    small.getContext('2d').drawImage(pic, x, y, w, h, 0, 0, sw, sh);
    g.imageSmoothingEnabled = false; g.drawImage(small, 0, 0, sw, sh, x, y, w, h); g.imageSmoothingEnabled = true;
  }
  function wrapText(g, text, maxW) {
    var out = [];
    String(text || '').split('\n').forEach(function (para) {
      var line = '';
      para.split(' ').forEach(function (word) {
        var test = line ? line + ' ' + word : word;
        if (g.measureText(test).width > maxW && line) { out.push(line); line = word; } else { line = test; }
      });
      out.push(line);
    });
    return out;
  }
  function drawObject(g, o) {
    g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = o.line; g.fillStyle = o.line; g.lineWidth = lineW(o);
    var b = box(o);
    if (o.t === 'rect') { if (o.fill) { g.fillStyle = o.fill; g.fillRect(b.x, b.y, b.w, b.h); } if (o.w > 0) g.strokeRect(b.x, b.y, b.w, b.h); }
    else if (o.t === 'oval') { g.beginPath(); g.ellipse(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, b.h / 2, 0, 0, Math.PI * 2); if (o.fill) { g.fillStyle = o.fill; g.fill(); } if (o.w > 0) g.stroke(); }
    else if (o.t === 'line' || o.t === 'arrow') {
      var ang = Math.atan2(o.y2 - o.y1, o.x2 - o.x1), cut = o.t === 'arrow' ? Math.max(12, o.w * 4) * 0.6 : 0;
      g.beginPath(); g.moveTo(o.x1, o.y1); g.lineTo(o.x2 - Math.cos(ang) * cut, o.y2 - Math.sin(ang) * cut); g.stroke();
      if (o.t === 'arrow') arrowHead(g, o);
    }
    else if (o.t === 'free') { g.beginPath(); g.moveTo(o.pts[0].x, o.pts[0].y); if (o.pts.length === 1) g.lineTo(o.pts[0].x + 0.01, o.pts[0].y); o.pts.forEach(function (p, i) { if (i) g.lineTo(p.x, p.y); }); g.stroke(); }
    else if (o.t === 'highlight') { g.globalAlpha = 0.45; g.fillStyle = o.fill || '#ffeb3b'; g.fillRect(b.x, b.y, b.w, b.h); }
    else if (o.t === 'hide') { g.restore(); pixelate(g, b, o.w * 2); return; }
    else if (o.t === 'text') { g.font = fontOf(o); g.textBaseline = 'top'; textLines(o).forEach(function (l, i) { g.fillText(l, o.x1, o.y1 + i * o.fs * 1.25); }); }
    else if (o.t === 'bubble') {
      var r = Math.min(10, b.w / 4, b.h / 4), tx = o.tx, ty = o.ty, cx = b.x + b.w / 2, bottom = b.y + b.h;
      g.beginPath(); g.moveTo(b.x + r, b.y); g.lineTo(b.x + b.w - r, b.y); g.quadraticCurveTo(b.x + b.w, b.y, b.x + b.w, b.y + r);
      g.lineTo(b.x + b.w, bottom - r); g.quadraticCurveTo(b.x + b.w, bottom, b.x + b.w - r, bottom);
      g.lineTo(cx + 12, bottom); g.lineTo(tx, ty); g.lineTo(cx - 12, bottom); g.lineTo(b.x + r, bottom); g.quadraticCurveTo(b.x, bottom, b.x, bottom - r);
      g.lineTo(b.x, b.y + r); g.quadraticCurveTo(b.x, b.y, b.x + r, b.y); g.closePath();
      g.fillStyle = o.fill || '#ffffff'; g.fill(); if (o.w > 0) g.stroke();
      g.fillStyle = o.line; g.font = fontOf(o); g.textBaseline = 'top';
      wrapText(g, o.text, b.w - 12).forEach(function (l, i) { g.fillText(l, b.x + 6, b.y + 5 + i * o.fs * 1.25); });
    }

      var rad = o.fs * 0.9; g.beginPath(); g.arc(o.x1, o.y1, rad, 0, Math.PI * 2); g.fillStyle = o.fill || o.line; g.fill();

    g.restore();
  }
  function redraw() {
    pctx.clearRect(0, 0, pic.width, pic.height); pctx.drawImage(base, 0, 0);
    objects.forEach(function (o) { drawObject(pctx, o); });
    drawOverlay();
  }
  function handlesOf(o) {
    if (o.t === 'line' || o.t === 'arrow') return [{ x: o.x1, y: o.y1, k: 'p1' }, { x: o.x2, y: o.y2, k: 'p2' }];
    if (o.t === 'free' || o.t === 'step' || o.t === 'text') return [];
    var b = box(o), hs = [{ x: b.x, y: b.y, k: 'tl' }, { x: b.x + b.w, y: b.y, k: 'tr' }, { x: b.x, y: b.y + b.h, k: 'bl' }, { x: b.x + b.w, y: b.y + b.h, k: 'br' }];
    if (o.t === 'bubble') hs.push({ x: o.tx, y: o.ty, k: 'tail' });
    return hs;
  }
  function drawOverlay() {
    syncHandles();
    octx.clearRect(0, 0, ov.width, ov.height);
    if (crop) { drawCropOverlay(); return; }
    if (!sel) return;
    var b = box(sel), s = 7 / zoom;
    octx.save(); octx.lineWidth = 1 / zoom; octx.setLineDash([4 / zoom, 3 / zoom]); octx.strokeStyle = '#1e88e5'; octx.strokeRect(b.x, b.y, b.w, b.h); octx.setLineDash([]);
    handlesOf(sel).forEach(function (h) { octx.fillStyle = '#fff'; octx.strokeStyle = '#000'; octx.fillRect(h.x - s / 2, h.y - s / 2, s, s); octx.strokeRect(h.x - s / 2, h.y - s / 2, s, s); });
    octx.restore();
  }

  /* ---- history ---- */
  function snap() { return { base: base, objects: JSON.parse(JSON.stringify(objects)), photo: { x: photo.x, y: photo.y, w: photo.w, h: photo.h } }; }
  function apply(s) { base = s.base; photo = { x: s.photo.x, y: s.photo.y, w: s.photo.w, h: s.photo.h }; objects = JSON.parse(JSON.stringify(s.objects)); sel = null; setSize(base.width, base.height); redraw(); showProps(); }
  function pushUndo() { undoStack.push(snap()); redoStack = []; if (undoStack.length > 60) undoStack.shift(); buttons(); }
  function undo() { if (!undoStack.length) return; cancelCrop(); commitText(); redoStack.push(snap()); apply(undoStack.pop()); changed(); buttons(); }
  function redo() { if (!redoStack.length) return; cancelCrop(); undoStack.push(snap()); apply(redoStack.pop()); changed(); buttons(); }
  function buttons() {
    $('undo').disabled = !undoStack.length; $('redo').disabled = !redoStack.length; $('del').disabled = !sel;
    ['save', 'copy', 'zin', 'zout', 'zfit', 'zlabel'].forEach(function (id) { $(id).disabled = !loaded; });
  }
  function status() { $('status').textContent = loaded ? pic.width + ' \u00d7 ' + pic.height + ' px' + (objects.length ? '   \u00b7   ' + objects.length + ' object' + (objects.length > 1 ? 's' : '') : '') : 'No picture'; }

  /* ---- zoom ---- */
  function setSize(w, h) { pic.width = ov.width = w; pic.height = ov.height = h; applyZoom(); }
  function applyZoom() {
    pic.style.width = ov.style.width = pic.width * zoom + 'px'; pic.style.height = ov.style.height = pic.height * zoom + 'px';
    pic.classList.toggle('crisp', zoom > 2); $('zlabel').textContent = Math.round(zoom * 100) + '%'; status(); drawOverlay();
  }
  function fitZoom() {
    var v = $('view'); zoom = Math.max(0.05, Math.min(1, (v.clientWidth - 40) / Math.max(1, pic.width), (v.clientHeight - 40) / Math.max(1, pic.height))); fitMode = true; applyZoom();
  }
  function setZoom(z) { zoom = Math.min(8, Math.max(0.05, z)); fitMode = false; applyZoom(); }
  window.addEventListener('resize', function () { layout(); if (fitMode && loaded) fitZoom(); });
  $('view').addEventListener('wheel', function (e) { if (e.ctrlKey) { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); } }, { passive: false });
  $('zin').onclick = function () { setZoom(zoom * 1.25); }; $('zout').onclick = function () { setZoom(zoom / 1.25); };
  $('zlabel').onclick = function () { setZoom(1); }; $('zfit').onclick = fitZoom;
  function layout() { document.documentElement.style.setProperty('--toph', $('top').offsetHeight + 'px'); }

  /* ---- telling the app about the picture (as a PNG), saving and copying ---- */
  function toBase64(blob, done) { var fr = new FileReader(); fr.onload = function () { done(String(fr.result).split(',')[1] || ''); }; fr.readAsDataURL(blob); }
  function emitNow(edited, then) {
    clearTimeout(stateTimer); stateTimer = 0;
