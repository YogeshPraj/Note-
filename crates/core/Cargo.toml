[package]
name = "notepp-core"
version.workspace = true
edition = "2024"
description = "Note++ editor core: tabs, sessions, search, encodings, crypto, HTTP, updater. No UI and no OS code."

[lints]
workspace = true

[dependencies]
encoding_rs = "0.8.42"
fancy-regex = "0.19.2"
md-5 = "0.10"
pulldown-cmark = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
# Encrypted pad, Bitwarden CLI installer, HTTP scratchpad.
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
flate2 = "1"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["gzip", "brotli"] }
# Checking that an update was signed (already in the build through ureq's TLS).
ring = "0.17"
# Compare (text diff).
similar = { version = "2", features = ["inline"] }
