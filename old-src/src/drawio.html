<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- The drawio iframe lives at drawio:// which is a privileged custom
       protocol registered in main.js. frame-src must include it. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    frame-src drawio: 'self';
    img-src 'self' data: blob:;
    connect-src 'self';
  " />
  <title>draw.io</title>
  <style>
    html, body, iframe {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      border: 0; background: #ffffff;
      overflow: hidden;
    }
    .empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #9ca3af; font-size: 13px;
    }
  </style>
</head>
<body>
  <iframe id="drawio-frame"></iframe>

  <script>
    // The drawio iframe URL parameters disable cloud, sharing, splash, exit,
    // and other host-app features that don't apply when embedded. See
    // https://www.drawio.com/doc/faq/supported-url-parameters
    //   embed=1            → run in embed mode (postMessage protocol)
    //   proto=json         → use JSON message format (cleaner than legacy)
    //   ui=atlas           → modern UI (vs 'min', 'sketch', 'kennedy')
    //   spin=1             → show spinner while loading
    //   noSaveBtn=1        → we save through our own File menu / Ctrl+S
    //   noExitBtn=1        → no exit button (we're the host)
    //   saveAndExit=0      → disable
    //   stealth=1          → no external network calls (analytics etc.)
    //   configure=1        → wait for a configure message before init
    const params = [
      'embed=1', 'proto=json', 'spin=1', 'ui=atlas',
      'noSaveBtn=1', 'noExitBtn=1', 'saveAndExit=0',
      'stealth=1',
    ].join('&');

    const frame = document.getElementById('drawio-frame');
    let drawioReady = false;
    let pendingLoadXml = null;

    // Per-load generation counter. Bumped on every dw-load. drawio fires an
    // autosave event right after applying a loaded scene; we ignore any
    // autosave/save/export whose generation no longer matches, so loading
    // a tab (or switching between tabs that share this iframe) doesn't
    // mark the freshly activated tab dirty. Same pattern as the whiteboard
    // iframe's loadGen.
    let loadGen = 0;
    // While loadSuppress > 0, ignore all drawio state events. drawio fires
    // multiple change events synchronously while it builds the graph from
    // an XML load — none of those should count as user edits.
    let loadSuppress = 0;

    // Minimal valid empty drawio document. Sending xml:'' makes the embed
    // sit on the "Loading..." spinner forever — drawio expects at least a
    // well-formed <mxfile> envelope to consider the load complete.
    const EMPTY_MXFILE =
      '<mxfile host="notepp" version="1"><diagram id="page1" name="Page-1">' +
        '<mxGraphModel dx="800" dy="600" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="850" pageHeight="1100" math="0" shadow="0">' +
          '<root><mxCell id="0"/><mxCell id="1" parent="0"/></root>' +
        '</mxGraphModel>' +
      '</diagram></mxfile>';

    function postToDrawio(msg) {
      try { frame.contentWindow?.postMessage(JSON.stringify(msg), '*'); } catch {}
    }
    function postToParent(msg) {
      try { window.parent?.postMessage(msg, '*'); } catch {}
    }

    // Centralised load-into-drawio: bumps generation, arms the suppression
    // window so the resulting load-echo events get dropped, then dispatches
    // the actual action. autosave:1 enables the continuous state events
    // we need to mirror the user's drawing into tab.dirty / tab.content.
    function loadIntoDrawio(xml) {
      loadGen += 1;
      loadSuppress += 1;
      postToDrawio({ action: 'load', xml, autosave: 1 });
      // Release the suppression after a short window — drawio finishes its
      // post-load change cascade within ~150ms in practice.
      setTimeout(() => { loadSuppress = Math.max(0, loadSuppress - 1); }, 400);
    }

    // Single message listener — disambiguates by payload shape:
    //   parent → us : object with .type (dw-load / dw-get-data / dw-theme)
    //   drawio → us : JSON-stringified object with .event (init / save / …)
    // We avoid `e.source !== frame.contentWindow` because postMessage source
    // identity is unreliable across custom-protocol iframe boundaries.
    window.addEventListener('message', (e) => {
      const raw = e.data;

      // ── Parent → us (object payloads with `type`) ────────────────────────
      if (raw && typeof raw === 'object' && typeof raw.type === 'string') {
        if (raw.type === 'dw-load') {
          const xml = (raw.content && raw.content.trim()) ? raw.content : EMPTY_MXFILE;
          if (drawioReady) loadIntoDrawio(xml);
          else pendingLoadXml = xml;
          return;
        }
        if (raw.type === 'dw-get-data') {
          if (drawioReady) postToDrawio({ action: 'export', format: 'xml' });
          return;
        }
        if (raw.type === 'dw-theme') {
          postToDrawio({ action: 'configure', config: { ui: raw.dark ? 'dark' : 'kennedy' } });
          return;
        }
        return;
      }

      // ── drawio → us (JSON-string payloads with `event`) ──────────────────
      if (typeof raw === 'string') {
        let m;
        try { m = JSON.parse(raw); } catch { return; }
        if (!m || !m.event) return;

        if (m.event === 'init' || m.event === 'configure') {
          drawioReady = true;
          // Always send something — fall back to EMPTY_MXFILE if the parent
          // hasn't pushed content yet (new tab race condition).
          const xml = (pendingLoadXml && pendingLoadXml.trim()) ? pendingLoadXml : EMPTY_MXFILE;
          loadIntoDrawio(xml);
          pendingLoadXml = null;
          postToParent({ type: 'dw-ready' });
          return;
        }
        if (m.event === 'autosave' || m.event === 'save' || m.event === 'export') {
          // Drop load-echoes so freshly activated tabs don't get marked dirty.
          if (loadSuppress > 0) return;
          postToParent({ type: 'dw-state', content: m.xml || '' });
          return;
        }
        // ignore other events (exit, etc.)
      }
    });

    // Boot: load the drawio webapp via our custom protocol. We use the
    // virtual host "app" so the URL parser puts the path in `pathname` (not
    // `host`); the protocol handler in main only honours this host.
    frame.src = 'drawio://app/index.html?' + params;
  </script>
</body>
</html>
