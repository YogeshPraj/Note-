<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
  <title>Updating Note++</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #1e1e2e;
      color: #e5e7eb;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Custom title bar — the whole strip is draggable so the user can move
       the window around; the minimize button is a no-drag interactive area. */
    .titlebar {
      -webkit-app-region: drag;
      height: 28px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      background: transparent;
    }
    .win-btn {
      -webkit-app-region: no-drag;
      width: 40px;
      height: 28px;
      background: transparent;
      border: 0;
      color: #9ca3af;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .win-btn:hover { background: rgba(255,255,255,0.08); color: #f3f4f6; }
    .win-btn:active { background: rgba(255,255,255,0.14); }

    .frame {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100% - 28px);   /* leave room for the title bar */
      gap: 18px;
      padding: 16px 24px 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .logo {
      font-size: 36px;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: -1px;
    }
    .title {
      font-size: 15px;
      font-weight: 500;
      color: #f3f4f6;
    }
    .sub {
      font-size: 12px;
      color: #9ca3af;
      margin-top: -10px;
    }

    /* Progress bar — fills smoothly from 0 → 100% via JS */
    .bar-wrap {
      width: 100%;
      max-width: 360px;
      height: 6px;
      background: #374151;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 3px;
      transition: width 0.12s linear;
    }

    /* Success state (replaces progress when install is "done") */
    .done {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .done.show { display: flex; }
    .progress { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 10px; }
    .progress.hide { display: none; }
    .check {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 26px;
      font-weight: bold;
      animation: pop 280ms cubic-bezier(.5,1.6,.4,1) both;
    }
    @keyframes pop {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    .success-text {
      font-size: 14px;
      font-weight: 600;
      color: #f3f4f6;
    }
    .success-sub {
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <!-- Draggable title bar with a single minimize control. We don't expose
       close/maximize because killing this window mid-install would skip the
       quitAndInstall trigger; the install always completes on its own. -->
  <div class="titlebar">
    <button class="win-btn" id="btn-minimize" title="Minimize" aria-label="Minimize">&#8211;</button>
  </div>

  <div class="frame">
    <div class="logo">N++</div>

    <!-- Progress phase -->
    <div class="progress" id="progress">
      <div class="title" id="phase-title">Installing update…</div>
      <div class="sub" id="phase-sub">Upgrading to v<span id="new-version">…</span></div>
      <div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>
    </div>

    <!-- Done phase -->
    <div class="done" id="done">
      <div class="check">✓</div>
      <div class="success-text">Upgraded to v<span id="done-version">…</span></div>
      <div class="success-sub">Note++ will relaunch in a moment…</div>
    </div>
  </div>

  <script>
    // Minimize button → forwards to main via IPC (frameless windows have no
    // native window controls).
    document.getElementById('btn-minimize')?.addEventListener('click', () => {
      try { window.updaterApi.minimize(); } catch {}
    });

    // Fetch the pending update version from main and animate progress.
    // When progress hits 100%, switch to the success card, then after a
    // 2-second display window, ask main to perform quitAndInstall — which
    // tears down the app, runs the silent installer, and relaunches the
    // new version.
    (async () => {
      let version = '';
      try { version = await window.updaterApi.getPendingVersion(); } catch {}
      version = version || '?';
      document.getElementById('new-version').textContent  = version;
      document.getElementById('done-version').textContent = version;

      const bar      = document.getElementById('bar');
      const progress = document.getElementById('progress');
      const done     = document.getElementById('done');

      // Fake-but-believable progress: ramp 0 → 95% over ~2.5 s, then jump
      // to 100% and reveal the success card. The actual NSIS install is
      // very fast (sub-second to a few seconds) and runs in the next stage,
      // so this just gives the user something to watch.
      const startedAt = performance.now();
      const RAMP_MS = 2500;
      function tick() {
        const elapsed = performance.now() - startedAt;
        const pct = Math.min(95, (elapsed / RAMP_MS) * 95);
        bar.style.width = pct + '%';
        if (elapsed < RAMP_MS) requestAnimationFrame(tick);
        else finish();
      }
      function finish() {
        bar.style.width = '100%';
        setTimeout(() => {
          progress.classList.add('hide');
          done.classList.add('show');
          // 2-second post-success display, then trigger the real install
          setTimeout(() => {
            window.updaterApi.installAndQuit();
          }, 2000);
        }, 180);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
