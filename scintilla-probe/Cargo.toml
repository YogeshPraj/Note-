[package]
name = "sci_probe"
version = "0.1.0"
edition = "2024"

[dependencies]
encoding_rs = "0.8.42"
fancy-regex = "0.19.2"
md-5 = "0.10"
pulldown-cmark = "0.13.5"
raw-window-handle = "0.6.2"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
# The `implement` macro for the file drop target refers to this crate by name.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Storage_Xps", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_Threading", "Win32_Security", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_Graphics_Printing", "Win32_System_RemoteDesktop"] }
wry = "0.57.1"
# Encrypted pad (same formats as the Electron app), Bitwarden CLI installer, HTTP scratchpad.
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
flate2 = "1"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["gzip", "brotli"] }

# Key derivation is slow unoptimised; keep the tests quick.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
