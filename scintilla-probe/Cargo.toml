[package]
name = "sci_probe"
version = "0.1.0"
edition = "2024"

[dependencies]
encoding_rs = "0.8.42"
fancy-regex = "0.19.2"
md-5 = "0.10"
pulldown-cmark = "0.13.5"
raw-window-handle = "0.6.2"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
# The `implement` macro for the file drop target refers to this crate by name.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Storage_Xps", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_Threading", "Win32_Security", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_Graphics_Printing"] }
wry = "0.57.1"
