<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: https: http:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src about: data:; font-src data:; worker-src blob:">
<style>
:root { --bg:#fff; --fg:#24292f; --muted:#57606a; --border:#d0d7de; --code:#f6f8fa; --link:#0969da; --bar:#f0f0f0; --barborder:#c0c0c0; --btn:#dcdcdc; --quote:#d0d7de; }
body.dark { --bg:#1e1e1e; --fg:#d4d4d4; --muted:#9da5ae; --border:#3c3c3c; --code:#2b2b2b; --link:#4da3ff; --bar:#3c3c3c; --barborder:#555; --btn:#505050; --quote:#555; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.65 "Segoe UI", system-ui, sans-serif; overflow:hidden; }
#hdr { display:flex; align-items:center; gap:4px; height:30px; padding:0 6px 0 10px; background:var(--bar); border-bottom:1px solid var(--barborder); user-select:none; }
#title { font-size:11px; font-weight:600; letter-spacing:.08em; opacity:.8; flex:1; }
button { width:24px; height:22px; padding:0; border:1px solid transparent; border-radius:3px; background:transparent; color:var(--fg); font-size:13px; cursor:pointer; }
button:hover { background:var(--btn); }
button.on { background:#cfe0f7; border-color:#7aa7e0; color:#000; }
#zlabel { font:11px Consolas, monospace; min-width:42px; text-align:center; cursor:pointer; opacity:.8; }
#body { position:absolute; top:31px; left:0; right:0; bottom:0; }
#md, #mm, #msg { position:absolute; inset:0; overflow:auto; padding:20px 28px; }
#frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
#msg { color:var(--muted); display:flex; align-items:center; justify-content:center; text-align:center; }
.hidden { display:none !important; }
#md h1, #md h2 { padding-bottom:.3em; border-bottom:1px solid var(--border); }
#md h1, #md h2, #md h3, #md h4 { margin:1.4em 0 .6em; line-height:1.25; }
#md h1:first-child { margin-top:0; }
#md a { color:var(--link); }
#md code { background:var(--code); padding:.15em .35em; border-radius:4px; font:12.5px Consolas, monospace; }
#md pre { background:var(--code); padding:12px 14px; border-radius:6px; overflow:auto; }
#md pre code { background:none; padding:0; }
#md blockquote { margin:0; padding:0 1em; color:var(--muted); border-left:.25em solid var(--quote); }
#md table { border-collapse:collapse; margin:1em 0; }
#md th, #md td { border:1px solid var(--border); padding:6px 13px; }
#md tr:nth-child(2n) { background:var(--code); }
#md img { max-width:100%; }
#md hr { border:0; border-top:1px solid var(--border); }
#md ul.contains-task-list { list-style:none; padding-left:1.2em; }
.mermaid { background:transparent !important; text-align:center; }
#md pre.mermaid { background:transparent; }
.merr { color:#c00; font:12px Consolas, monospace; white-space:pre-wrap; text-align:left; }
#http { position:absolute; inset:0; overflow:auto; padding:0; }
#http .hbar { display:flex; align-items:center; gap:10px; padding:8px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:2; }
#http .hm { font:600 12px Consolas, monospace; }
#http .hu { font:12px Consolas, monospace; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
#http .hmeta { font-size:12px; color:var(--muted); }
#http .hbadge { padding:2px 9px; border-radius:10px; font:600 12px "Segoe UI", sans-serif; color:#fff; }
#http .hbadge.ok { background:#2e9e4f; } #http .hbadge.redir { background:#d08a12; } #http .hbadge.err { background:#cc3b3b; }
#http .hpend { padding:20px 16px; color:var(--muted); }
#http .herr { padding:14px 16px; color:#c00; font:12px Consolas, monospace; white-space:pre-wrap; }
body.dark #http .herr { color:#f48771; }
#http .htabs { display:flex; gap:2px; padding:6px 10px 0; border-bottom:1px solid var(--border); }
#http .htab { width:auto; height:26px; padding:0 12px; border-radius:3px 3px 0 0; font:12px "Segoe UI", sans-serif; }
#http .htab.on { background:var(--code); border-color:var(--border); border-bottom-color:var(--code); }
#http .hcopy { width:auto; height:24px; padding:0 10px; border:1px solid var(--border); font:12px "Segoe UI", sans-serif; }
#http pre.hbody { margin:0; padding:12px 16px; font:12.5px/1.5 Consolas, monospace; white-space:pre-wrap; word-break:break-word; }
#http .hrow { display:flex; gap:12px; padding:3px 16px; font:12px Consolas, monospace; border-bottom:1px solid var(--border); }
#http .hk { flex:0 0 220px; color:var(--link); word-break:break-all; } #http .hv { flex:1; word-break:break-all; }
#log { position:absolute; inset:0; display:flex; flex-direction:column; }
#log .lbar { display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
#log .lbar input[type=text] { flex:1; min-width:120px; height:24px; padding:0 8px; border:1px solid var(--border); border-radius:3px; background:var(--bg); color:var(--fg); font:12px Consolas, monospace; }
#log .lbar input.bad { border-color:#cc3b3b; }
#log .lbar label { font:12px "Segoe UI", sans-serif; display:flex; align-items:center; gap:3px; }
#log .lv { width:auto; height:22px; padding:0 8px; border:1px solid var(--border); font:600 11px "Segoe UI", sans-serif; opacity:.45; }
#log .lv.on { opacity:1; }
#log .lv[data-l=E].on { background:#cc3b3b; color:#fff; } #log .lv[data-l=W].on { background:#d08a12; color:#fff; } #log .lv[data-l=I].on { background:#3883fa; color:#fff; } #log .lv[data-l=D].on { background:#7a7a7a; color:#fff; }
#log .lbtn { width:auto; height:24px; padding:0 10px; border:1px solid var(--border); font:12px "Segoe UI", sans-serif; }
#log .lbtn.on { background:#cfe0f7; border-color:#7aa7e0; color:#000; }
#log .linfo { padding:3px 12px; font:11px "Segoe UI", sans-serif; color:var(--muted); border-bottom:1px solid var(--border); }
#logbody { flex:1; overflow:auto; padding:4px 0; font:12px/1.5 Consolas, 'Cascadia Code', monospace; }
#logbody div { padding:0 12px; white-space:pre-wrap; word-break:break-all; }
#logbody .E { color:#cc3b3b; } #logbody .W { color:#b57614; } #logbody .D { color:var(--muted); }
body.dark #logbody .E { color:#f48771; } body.dark #logbody .W { color:#e5c07b; }
#je { position:absolute; inset:0; }
#je .jsoneditor { border:0; height:100%; }
#jerr { position:absolute; inset:0; overflow:auto; padding:16px 20px; font-size:12px; }
#jerr .t { color:#c00; font:600 12px Consolas, monospace; }
#jerr .m { color:#c00; font:12px Consolas, monospace; white-space:pre-wrap; margin-top:6px; }
#jerr .fix { margin-top:14px; padding:10px 12px; border:1px solid var(--border); border-radius:4px; }
#jerr .fix button { width:auto; height:26px; padding:0 12px; border:1px solid #3883fa; background:#3883fa; color:#fff; border-radius:3px; margin-top:8px; }
body.dark #jerr .t, body.dark #jerr .m { color:#f48771; }
/* JSON editor, dark: the library is light-only, so recolour the tree, the text modes and the bars. */
body.dark .jsoneditor, body.dark div.jsoneditor-tree, body.dark div.jsoneditor-tree-inner { background:#1e1e1e; color:#d4d4d4; }
body.dark div.jsoneditor-field, body.dark div.jsoneditor-readonly, body.dark div.jsoneditor-value { color:#d4d4d4; }
body.dark div.jsoneditor-value.jsoneditor-string { color:#ce9178; }
body.dark div.jsoneditor-value.jsoneditor-number { color:#b5cea8; }
body.dark div.jsoneditor-value.jsoneditor-boolean, body.dark div.jsoneditor-value.jsoneditor-null { color:#569cd6; }
body.dark div.jsoneditor-field.jsoneditor-highlight, body.dark div.jsoneditor-field[contenteditable=true]:focus, body.dark div.jsoneditor-field[contenteditable=true]:hover,
body.dark div.jsoneditor-value.jsoneditor-highlight, body.dark div.jsoneditor-value[contenteditable=true]:focus, body.dark div.jsoneditor-value[contenteditable=true]:hover { background:#2f3a4a; border-color:#3883fa; }
body.dark tr.jsoneditor-selected, body.dark tr.jsoneditor-selected tr, body.dark tr.jsoneditor-selected td { background:#2a3b57; }
body.dark .jsoneditor-navigation-bar, body.dark .jsoneditor-statusbar { background:#2b2b2b; color:#aaa; border-color:#3c3c3c; }
body.dark .jsoneditor-navigation-bar .jsoneditor-separator, body.dark .jsoneditor-treepath-element { color:#bbb; }
body.dark table.jsoneditor-search div.jsoneditor-frame { background:#fff; }
body.dark .jsoneditor-text, body.dark textarea.jsoneditor-text, body.dark .ace-jsoneditor, body.dark .ace-jsoneditor .ace_scroller, body.dark .ace-jsoneditor .ace_gutter { background:#1e1e1e; color:#d4d4d4; }
body.dark .ace-jsoneditor .ace_gutter { color:#858585; }
body.dark .ace-jsoneditor .ace_string { color:#ce9178; }
body.dark .ace-jsoneditor .ace_constant.ace_numeric { color:#b5cea8; }
body.dark .ace-jsoneditor .ace_variable { color:#9cdcfe; }
body.dark .ace-jsoneditor .ace_marker-layer .ace_active-line { background:#2a2a2b; }
body.dark .ace-jsoneditor .ace_cursor { color:#d4d4d4; }
body.dark .jsoneditor-poweredBy { display:none; }
</style>
</head>
<body>
<div id="hdr">
  <span id="title">PREVIEW</span>
  <button id="zout" title="Zoom out (Ctrl+Wheel)">&minus;</button>
  <span id="zlabel" title="Reset zoom">100%</span>
  <button id="zin" title="Zoom in (Ctrl+Wheel)">+</button>
  <button id="max" title="Maximise preview">&#9974;</button>
  <button id="refresh" title="Refresh">&#10227;</button>
  <button id="close" title="Close preview (Ctrl+Shift+V)">&#10005;</button>
</div>
<div id="body">
  <div id="md" class="hidden"></div>
  <iframe id="frame" class="hidden" sandbox="allow-scripts"></iframe>
  <div id="mm" class="hidden"></div>
  <div id="je" class="hidden"></div>
  <div id="jerr" class="hidden"></div>
  <div id="http" class="hidden"></div>
  <div id="log" class="hidden"></div>
  <div id="msg">Open a Markdown, HTML, Mermaid or JSON file to see a live preview.</div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var zoom = 1, dark = false, pendingMermaid = null;
  var post = function (m) { window.ipc.postMessage(m); };

  function applyZoom() { $('body').style.zoom = zoom; $('zlabel').textContent = Math.round(zoom * 100) + '%'; }
  function setZoom(z) { zoom = Math.min(4, Math.max(0.3, z)); applyZoom(); }
  $('zin').onclick = function () { setZoom(zoom + 0.1); };
  $('zout').onclick = function () { setZoom(zoom - 0.1); };
  $('zlabel').onclick = function () { setZoom(1); };
  $('max').onclick = function () { post('max'); };
  $('refresh').onclick = function () { post('refresh'); };
  $('close').onclick = function () { post('close'); };
  window.addEventListener('wheel', function (e) {
    if (e.ctrlKey) { e.preventDefault(); setZoom(zoom + (e.deltaY < 0 ? 0.1 : -0.1)); }
  }, { passive: false });

  function show(which) {
    ['md', 'frame', 'mm', 'je', 'jerr', 'http', 'log', 'msg'].forEach(function (id) { $(id).classList.toggle('hidden', id !== which); });
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  async function runMermaid(root) {
    var nodes = Array.prototype.slice.call(root.querySelectorAll('.mermaid'));
    if (!nodes.length) return;
    if (!window.mermaid) { pendingMermaid = root; post('need-mermaid'); return; }
    window.mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });
    for (var i = 0; i < nodes.length; i++) {
      var src = nodes[i].textContent;
      try {
        var id = 'mmd' + Date.now() + '_' + i;
        var out = await window.mermaid.render(id, src);
        nodes[i].innerHTML = out.svg;
      } catch (e) {
        nodes[i].innerHTML = '<div class="merr">' + esc(String((e && e.message) || e)) + '</div>';
      }
      var junk = document.getElementById('d' + id);
      if (junk) junk.remove();
    }
  }

  /* ---- scroll sync with the editor ----
     Each top-level block is preceded by <span class="ln" data-line="N">. Between two markers the
     source line maps linearly onto the pixels between them. */
  var syncUntil = 0, syncFrame = 0, totalLines = 1;
  function marks() {
    var root = $('md'), rt = root.getBoundingClientRect().top, st = root.scrollTop;
    var m = Array.prototype.map.call(root.querySelectorAll('.ln'), function (el) {
      return { line: +el.getAttribute('data-line'), top: el.getBoundingClientRect().top - rt + st };
    });
    // A virtual marker for the end, so the last block has something to interpolate towards.
    m.push({ line: Math.max(totalLines, m.length ? m[m.length - 1].line + 1 : 1), top: root.scrollHeight });
    return m;
  }
  function lineToTop(line) {
    var m = marks(), i = 0;
    if (m.length < 2) return 0;
    while (i + 2 < m.length && m[i + 1].line <= line) i++;
    var a = m[i], b = m[i + 1], span = Math.max(1, b.line - a.line);
    return a.top + Math.min(1, Math.max(0, (line - a.line) / span)) * (b.top - a.top);
  }
  function topToLine(top) {
    var m = marks(), i = 0;
    if (m.length < 2) return 0;
    while (i + 2 < m.length && m[i + 1].top <= top) i++;
    var a = m[i], b = m[i + 1], span = Math.max(1, b.top - a.top);
    return a.line + Math.min(1, Math.max(0, (top - a.top) / span)) * (b.line - a.line);
  }
  $('md').addEventListener('scroll', function () {
    if (Date.now() < syncUntil || syncFrame) return;      // this scroll came from the editor
    syncFrame = requestAnimationFrame(function () {
      syncFrame = 0;
      post('line:' + topToLine($('md').scrollTop).toFixed(2));
    });
  });

  /* ---- JSON editor: josdejong/jsoneditor, the same library as the Electron app ---- */
  var je = null, jeText = null, jeBusy = false, pendingJson = null;
  function norm(s) { return s.replace(/\r\n?/g, '\n'); }
  // Close any braces/brackets a truncated file left open (null when nothing is missing).
  function balanceBraces(c) {
    var stack = [], q = false, esc1 = false, lc = false, bc = false;
    for (var i = 0; i < c.length; i++) {
      var ch = c[i], nx = c[i + 1];
      if (lc) { if (ch === '\n') lc = false; continue; }
      if (bc) { if (ch === '*' && nx === '/') { bc = false; i++; } continue; }
      if (esc1) { esc1 = false; continue; }
      if (q) { if (ch === '\\') esc1 = true; else if (ch === q) q = false; continue; }
      if (ch === '"' || ch === "'") { q = ch; continue; }
      if (ch === '/' && nx === '/') { lc = true; i++; continue; }
      if (ch === '/' && nx === '*') { bc = true; i++; continue; }
      if (ch === '{') stack.push('}');
      else if (ch === '[') stack.push(']');
      else if (ch === '}' || ch === ']') { if (!stack.length || stack[stack.length - 1] !== ch) return null; stack.pop(); }
    }
    return stack.length ? c + stack.reverse().join('') : null;
  }
  function showJsonError(text, err) {
    if (je) { je.destroy(); je = null; jeText = null; }
    var rec = null, note = '';
    if (window.JSON5) {
      try { rec = window.JSON5.parse(text); note = 'trailing commas, single quotes, comments, unquoted keys'; } catch (e) {}
      if (rec === null) {
        var b = balanceBraces(text);
        if (b) { try { rec = window.JSON5.parse(b); note = 'appended missing closing brace(s)/bracket(s)'; } catch (e) {} }
      }
    }
    var h = '<div class="t">JSON parse error</div><div class="m">' + esc(String((err && err.message) || err)) + '</div>';
    if (rec !== null) h += '<div class="fix"><div>We found a likely fix \u2014 ' + esc(note) + '.</div><button id="jfix">Auto-fix syntax</button></div>';
    $('jerr').innerHTML = h;
    show('jerr');
    if (rec !== null) $('jfix').onclick = function () { post('jsonfix:' + JSON.stringify(rec, null, 2)); };
  }
  function renderJson(text) {
    if (!window.JSONEditor) { pendingJson = text; post('need-jsoneditor'); return; }
    text = norm(text);
    if (je && text === jeText) { show('je'); return; }
    var v;
    try { v = JSON.parse(text); } catch (e) { showJsonError(text, e); return; }
    if (!je) {
      $('je').innerHTML = '';
      je = new window.JSONEditor($('je'), {
        mode: 'tree',
        modes: ['tree', 'view', 'form', 'code', 'text'],
        onChange: function () {
          if (jeBusy) return;
          try { var s = JSON.stringify(je.get(), null, 2); jeText = s; post('json:' + s); } catch (e) { /* mid-edit, not valid yet */ }
        },
        // Clicking or arrowing onto a node puts the editor on its line.
        onEvent: function (node, ev) {
          if (!node || !node.path) return;
          if (ev.type === 'click' || (ev.type === 'keydown' && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown'))) post('jpath:' + JSON.stringify(node.path));
        }
      });
      jeBusy = true; try { je.set(v); } finally { jeBusy = false; }
    } else {
      jeBusy = true; try { je.update(v); } finally { jeBusy = false; }   // keeps what is expanded
    }
    jeText = text;
    show('je');
  }

  /* ---- HTTP scratchpad: the last response (strings are only ever set as text) ---- */
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var httpTab = 'body';
  function copyText(t) {
    try { navigator.clipboard.writeText(t); return; } catch (e) {}
    var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {} ta.remove();
  }
  function renderHttp(raw) {
    var d; try { d = JSON.parse(raw); } catch (e) { return; }
    var root = $('http'), keep = root.scrollTop;
    root.textContent = '';
    var bar = el('div', 'hbar');
    root.appendChild(bar);
    if (d.state === 'pending') {
      bar.appendChild(el('span', 'hm', d.method)); bar.appendChild(el('span', 'hu', d.url));
      root.appendChild(el('div', 'hpend', 'Sending\u2026'));
    } else if (d.state === 'error') {
      bar.appendChild(el('span', 'hbadge err', 'failed')); bar.appendChild(el('span', 'hm', d.method)); bar.appendChild(el('span', 'hu', d.url));
      root.appendChild(el('div', 'herr', d.error));
    } else {
      var cls = d.status >= 200 && d.status < 300 ? 'ok' : d.status >= 300 && d.status < 400 ? 'redir' : 'err';
      bar.appendChild(el('span', 'hbadge ' + cls, d.status + ' ' + (d.statusText || '')));
      bar.appendChild(el('span', 'hm', d.method)); bar.appendChild(el('span', 'hu', d.url));
      var bits = [d.bytes.toLocaleString() + ' B', d.timeMs + ' ms'];
      if (d.redirects) bits.push(d.redirects + ' redirect' + (d.redirects === 1 ? '' : 's'));
      if (d.truncated) bits.push('truncated');
      if (d.vault && d.vault.length) bits.push('vault: ' + d.vault.join(', '));
      bar.appendChild(el('span', 'hmeta', bits.join(' \u00b7 ')));
      var copy = el('button', 'hcopy', 'Copy body'); copy.onclick = function () { copyText(d.body || ''); copy.textContent = 'Copied'; setTimeout(function () { copy.textContent = 'Copy body'; }, 1200); };
      bar.appendChild(copy);
      var tabs = el('div', 'htabs'), body = el('div'), heads = el('div');
      var b = el('button', 'htab', 'Body'), h = el('button', 'htab', 'Headers (' + d.headers.length + ')');
      function pick(which) { httpTab = which; b.classList.toggle('on', which === 'body'); h.classList.toggle('on', which === 'headers'); body.classList.toggle('hidden', which !== 'body'); heads.classList.toggle('hidden', which !== 'headers'); }
      b.onclick = function () { pick('body'); }; h.onclick = function () { pick('headers'); };
      tabs.appendChild(b); tabs.appendChild(h);
      var text = d.body || '';
      if (d.binary) text = (d.contentType || 'binary') + ' \u00b7 ' + d.bytes.toLocaleString() + ' bytes (not shown)';
      else if (/json/i.test(d.contentType || '')) { try { text = JSON.stringify(JSON.parse(text), null, 2); } catch (e) {} }
      body.appendChild(el('pre', 'hbody', text));
      d.headers.forEach(function (kv) { var r = el('div', 'hrow'); r.appendChild(el('span', 'hk', kv[0])); r.appendChild(el('span', 'hv', kv[1])); heads.appendChild(r); });
      root.appendChild(tabs); root.appendChild(body); root.appendChild(heads);
      pick(httpTab);
    }
    show('http');
    root.scrollTop = keep;
  }

  /* ---- Log Follow: lines are pushed in by the host as the file grows; filtering is done here ---- */
  var L = { lines: [], dropped: 0, follow: true, text: '', regex: false, on: { E: true, W: true, I: true, D: true }, built: false, skipped: 0, name: '', queued: false, last: 'O' };
  var LOG_CAP = 50000, LOG_SHOW = 4000;
  function level(t, prev) {
    if (/\b(FATAL|CRITICAL|SEVERE|ERROR|ERR)\b/i.test(t)) return 'E';
    if (/\bWARN(ING)?\b/i.test(t)) return 'W';
    if (/\bINFO\b/i.test(t)) return 'I';
    if (/\b(DEBUG|TRACE|VERBOSE)\b/i.test(t)) return 'D';
    return prev;   // a stack-trace line belongs to the line above it
  }
  function logBuild() {
    var root = $('log'); root.textContent = '';
    var bar = el('div', 'lbar');
    var inp = el('input'); inp.type = 'text'; inp.placeholder = 'Filter (text or regex)'; inp.id = 'lfilter';
    inp.oninput = function () { L.text = inp.value; logRender(); };
    var rx = el('label'); var cb = el('input'); cb.type = 'checkbox'; cb.onchange = function () { L.regex = cb.checked; logRender(); };
    rx.appendChild(cb); rx.appendChild(document.createTextNode('Regex'));
    bar.appendChild(inp); bar.appendChild(rx);
    [['E', 'ERROR'], ['W', 'WARN'], ['I', 'INFO'], ['D', 'DEBUG']].forEach(function (p) {
      var b = el('button', 'lv on', p[1]); b.setAttribute('data-l', p[0]);
      b.onclick = function () { L.on[p[0]] = !L.on[p[0]]; b.classList.toggle('on', L.on[p[0]]); logRender(); };
      bar.appendChild(b);
    });
    var f = el('button', 'lbtn on', 'Follow \u21e9'); f.id = 'lfollow';
    f.onclick = function () { L.follow = !L.follow; logRender(true); };
    var c = el('button', 'lbtn', 'Clear'); c.onclick = function () { L.lines = []; L.dropped = 0; L.skipped = 0; logRender(); };
    bar.appendChild(f); bar.appendChild(c);
    var info = el('div', 'linfo'); info.id = 'linfo';
    var body = el('div'); body.id = 'logbody';
    // Scrolling up means you want to read: following stops. Reaching the bottom again resumes it.
    body.onscroll = function () {
      var atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 6;
      if (atBottom !== L.follow) { L.follow = atBottom; $('lfollow').classList.toggle('on', L.follow); }
    };
    root.appendChild(bar); root.appendChild(info); root.appendChild(body);
    L.built = true;
  }
  function logMatcher() {
    if (!L.text) return null;
    if (L.regex) { try { var re = new RegExp(L.text, 'i'); $('lfilter').classList.remove('bad'); return function (s) { return re.test(s); }; } catch (e) { $('lfilter').classList.add('bad'); return null; } }
    $('lfilter').classList.remove('bad');
    var q = L.text.toLowerCase(); return function (s) { return s.toLowerCase().indexOf(q) >= 0; };
  }
  function logRender(force) {
    if (L.queued && !force) return;
    L.queued = true;
    setTimeout(function () {
      L.queued = false;
      var body = $('logbody'), keep = body.scrollTop, m = logMatcher(), out = [], n = 0;
      for (var i = L.lines.length - 1; i >= 0 && n < LOG_SHOW; i--) {
        var ln = L.lines[i];
        if (!L.on[ln.l === 'O' ? 'I' : ln.l]) continue;
        if (m && !m(ln.t)) continue;
        out.push('<div class="' + ln.l + '">' + esc(ln.t) + '</div>'); n++;
      }
      out.reverse();
      body.innerHTML = out.join('');
      $('lfollow').classList.toggle('on', L.follow);
      var notes = [L.lines.length.toLocaleString() + ' lines'];
      if (n >= LOG_SHOW) notes.push('showing the last ' + LOG_SHOW.toLocaleString() + ' that match');
      else if (m || !(L.on.E && L.on.W && L.on.I && L.on.D)) notes.push(n.toLocaleString() + ' shown');
      if (L.dropped) notes.push(L.dropped.toLocaleString() + ' older lines dropped from the buffer');
      if (L.skipped) notes.push('showing only the end of the file (' + (L.skipped / 1048576).toFixed(1) + ' MB skipped)');
      $('linfo').textContent = L.name + ' \u00b7 ' + notes.join(' \u00b7 ');
      if (L.follow) body.scrollTop = body.scrollHeight; else body.scrollTop = keep;
    }, 30);
  }
  function logPush(lines) {
    for (var i = 0; i < lines.length; i++) { L.last = level(lines[i], L.last); L.lines.push({ t: lines[i], l: L.last }); }
    if (L.lines.length > LOG_CAP) { var d = L.lines.length - LOG_CAP; L.lines.splice(0, d); L.dropped += d; }
  }
  function logSet(raw) {
    var d = JSON.parse(raw);
    if (!L.built) logBuild();
    L.lines = []; L.dropped = 0; L.last = 'O'; L.skipped = d.skipped || 0; L.name = d.name; L.follow = true;
    logPush(d.lines); show('log'); logRender(true);
  }
  function logAppend(raw) {
    var d = JSON.parse(raw);
    if (d.reset) { L.lines = []; L.dropped = 0; L.skipped = 0; L.last = 'O'; }
    logPush(d.lines); logRender();
  }

  window.np = {
    scrollToLine: function (line, total) {
      totalLines = total || totalLines;
      var root = $('md');
      if (root.classList.contains('hidden')) return;
      syncUntil = Date.now() + 150;                       // ignore the scroll event this causes
      root.scrollTop = lineToTop(line);
    },
    render: function (kind, payload) {
      if (kind === 'markdown') {
        var y = $('md').scrollTop;
        $('md').innerHTML = payload; show('md'); $('md').scrollTop = y;
        runMermaid($('md'));
      } else if (kind === 'mermaid') {
        var y2 = $('mm').scrollTop;
        $('mm').innerHTML = '<pre class="mermaid">' + esc(payload) + '</pre>'; show('mm'); $('mm').scrollTop = y2;
        runMermaid($('mm'));
      } else if (kind === 'log') {
        logSet(payload);
      } else if (kind === 'http') {
        renderHttp(payload);
      } else if (kind === 'json') {
        renderJson(payload);
      } else if (kind === 'html') {
        $('frame').srcdoc = payload; show('frame');
      } else {
        $('msg').textContent = payload; show('msg');
      }
    },
    setTheme: function (d) { dark = d; document.body.classList.toggle('dark', d); },
    setMax: function (m) { $('max').classList.toggle('on', m); },
    mermaidLoaded: function () { if (pendingMermaid) { var r = pendingMermaid; pendingMermaid = null; runMermaid(r); } },
    logAppend: logAppend,
    jsonLoaded: function () { if (pendingJson !== null) { var t = pendingJson; pendingJson = null; renderJson(t); } }
  };
  applyZoom();
})();
</script>
</body>
