<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Permissive CSP — Excalidraw uses inline styles, data: URLs for images, and
  blob: URLs for export operations. Same policy as the legacy whiteboard page
  so behaviour is unchanged from the parent renderer's perspective.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
<title>Note++ Whiteboard (Excalidraw)</title>

<!-- Excalidraw's CSS, copied next to the bundle by build-whiteboard.js -->
<link rel="stylesheet" href="./whiteboard.bundle.css">

<style>
  /* Fill the iframe completely and hide any flash before React mounts. */
  html, body, #root {
    height: 100%; width: 100%;
    margin: 0; padding: 0;
    overflow: hidden;
    background: #ffffff;
    color: #1e1e1e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body.dark { background: #121212; color: #cdd6f4; }
  #boot-msg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #888;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-msg">Loading whiteboard…</div>
  <!--
    The bundle replaces #root with the Excalidraw editor; the boot message
    sits underneath and is hidden as soon as React commits the first paint
    (Excalidraw paints a full-viewport canvas, covering it).
  -->
  <script src="./whiteboard.bundle.js"></script>
</body>
</html>
