<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Runner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Cascadia Code','Consolas',monospace; color:#e6edf3; overflow:hidden; }
  canvas { display:block; border:1px solid #30363d; border-radius:8px; }
  #ui { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:32px; font-size:0.8rem; color:#8b949e; }
  #ui span { color:#58a6ff; font-weight:bold; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#0d111799; backdrop-filter:blur(2px); }
  #overlay h2 { font-size:2rem; color:#58a6ff; letter-spacing:4px; }
  #overlay p  { color:#8b949e; font-size:0.85rem; }
  #overlay .score-display { font-size:1.2rem; color:#e3b341; }
  .btn { background:#1f6feb; color:#fff; border:none; border-radius:6px; padding:10px 28px; font-family:inherit; font-size:0.9rem; cursor:pointer; letter-spacing:2px; transition:background 0.15s; }
  .btn:hover { background:#388bfd; }
  #back { position:absolute; top:10px; left:10px; background:#21262d; color:#8b949e; border:1px solid #30363d; border-radius:6px; padding:5px 12px; font-family:inherit; font-size:0.75rem; cursor:pointer; }
  #back:hover { color:#e6edf3; border-color:#58a6ff; }
</style>
</head>
<body>
<button id="back" onclick="location.href='launcher.html'">← Games</button>
<div id="ui">
  <div>SCORE <span id="scoreVal">0</span></div>
  <div>BEST <span id="bestVal">0</span></div>
  <div>SPEED <span id="speedVal">1.0</span>x</div>
</div>
<canvas id="c"></canvas>
<div id="overlay">
  <h2>⚡ CODE RUNNER</h2>
  <p>// dodge the bugs. don't segfault.</p>
  <div class="score-display" id="finalScore" style="display:none"></div>
  <button class="btn" id="startBtn">▶ START</button>
  <p style="font-size:0.7rem;color:#484f58">SPACE / ↑ / CLICK to jump &nbsp;·&nbsp; double jump allowed</p>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width  = Math.min(window.innerWidth - 40, 800);
const H = canvas.height = 240;

const GROUND = H - 40;
const CHAR_X  = 80;

let state = 'idle'; // idle | running | dead
let score = 0, best = parseInt(localStorage.getItem('cr-best')||'0'), frame = 0;
let speed = 3;

// ── Cursor character ──────────────────────────────────────────────────────
const cursor = { y: GROUND, vy: 0, jumps: 0, w: 8, h: 24 };
function jumpCursor() {
  if (cursor.jumps < 2) { cursor.vy = -11; cursor.jumps++; }
}
function updateCursor() {
  cursor.vy += 0.55;
  cursor.y  += cursor.vy;
  if (cursor.y >= GROUND) { cursor.y = GROUND; cursor.vy = 0; cursor.jumps = 0; }
}

// ── Obstacles ─────────────────────────────────────────────────────────────
const OBS_TYPES = ['BUG','NULL','ERR','NaN','void','404','💀','SEGFAULT'];
let obstacles = [];
let obsTimer = 0;
function spawnObs() {
  const label = OBS_TYPES[Math.floor(Math.random()*OBS_TYPES.length)];
  const tall   = Math.random() < 0.25; // tall variant (duck obstacle)
  obstacles.push({ x: W + 20, label, tall, w: label.length * 8 + 8, h: tall ? 36 : 22 });
}
function updateObs() {
  obsTimer++;
  const minGap = Math.max(40, 90 - score/50);
  if (obsTimer > minGap) { spawnObs(); obsTimer = 0; }
  obstacles.forEach(o => o.x -= speed);
  obstacles = obstacles.filter(o => o.x > -100);
}

// ── Scrolling code background ─────────────────────────────────────────────
const CODE_LINES = [
  'function squashAllBugs(repo) { const bugs = findBugs(repo); bugs.forEach(b => kill(b)); }',
  'if (coffee.level < 10) { panic(); throw new Error("need more caffeine"); }',
  'const result = await fetch("/api/deploy").then(r => r.json()).catch(ohNo);',
  'while (!done) { grind(); drink(coffee); pushCode(); sleep(4); }',
  'export default class Developer extends Human { constructor() { super(); this.bugs = Infinity; } }',
];
let codeScroll = 0;

// ── Particles ─────────────────────────────────────────────────────────────
let particles = [];
function burst(x, y, color) {
  for (let i = 0; i < 8; i++)
    particles.push({ x, y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4-2, life:1, color });
}

// ── Draw ──────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // BG gradient
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0d1117'); grad.addColorStop(1,'#0a0e14');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  // Scrolling code lines
  ctx.font = '9px Consolas, monospace';
  codeScroll += speed * 0.4;
  CODE_LINES.forEach((line, i) => {
    ctx.fillStyle = `rgba(48,54,61,${0.3 + i*0.05})`;
    const rep = line.repeat(4);
    const off = codeScroll % (line.length * 5.4);
    ctx.fillText(rep, -off, 18 + i * 18);
  });

  // Ground line
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND + cursor.h); ctx.lineTo(W, GROUND + cursor.h); ctx.stroke();

  // Ground dashes
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1; ctx.setLineDash([6,8]);
  ctx.beginPath(); ctx.moveTo(0, GROUND + cursor.h + 6); ctx.lineTo(W, GROUND + cursor.h + 6); ctx.stroke();
  ctx.setLineDash([]);

  // Cursor character
  const cy = cursor.y;
  const blinkOn = Math.floor(frame / 8) % 2 === 0;
  // Body
  ctx.fillStyle = blinkOn ? '#58a6ff' : '#388bfd';
  ctx.fillRect(CHAR_X, cy, cursor.w, cursor.h);
  // Glow
  ctx.shadowColor = '#58a6ff'; ctx.shadowBlur = 10;
  ctx.fillRect(CHAR_X, cy, cursor.w, cursor.h);
  ctx.shadowBlur = 0;
  // Little "head" pixels
  ctx.fillStyle = '#79c0ff';
  ctx.fillRect(CHAR_X - 4, cy + 4, 4, 6);
  ctx.fillRect(CHAR_X + cursor.w, cy + 4, 4, 6);

  // Obstacles
  obstacles.forEach(o => {
    const oy = GROUND + cursor.h - o.h;
    ctx.fillStyle = '#f8514911'; ctx.fillRect(o.x - 2, oy - 2, o.w + 4, o.h + 4);
    ctx.fillStyle = '#f85149';
    ctx.font = `bold ${o.tall ? 9 : 11}px Consolas,monospace`;
    ctx.fillText(o.label, o.x, oy + o.h - 4);
    // Red glow
    ctx.shadowColor = '#f85149'; ctx.shadowBlur = 8;
    ctx.fillText(o.label, o.x, oy + o.h - 4);
    ctx.shadowBlur = 0;
  });

  // Particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    ctx.fillStyle = p.color + Math.floor(p.life * 255).toString(16).padStart(2,'0');
    ctx.fillRect(p.x, p.y, 3, 3);
    p.x += p.vx; p.y += p.vy; p.life -= 0.05;
  });

  // Score overlay
  ctx.fillStyle = '#58a6ff22';
  ctx.font = `bold ${H*0.6}px Consolas`;
  ctx.fillStyle = '#58a6ff08';
  ctx.fillText(Math.floor(score/10).toString().padStart(5,'0'), W/2 - 120, H - 10);
}

// ── Collision ─────────────────────────────────────────────────────────────
function checkCollision() {
  const cx1 = CHAR_X + 2, cy1 = cursor.y + 2, cx2 = CHAR_X + cursor.w - 2, cy2 = cursor.y + cursor.h - 2;
  for (const o of obstacles) {
    const oy = GROUND + cursor.h - o.h;
    if (cx2 > o.x && cx1 < o.x + o.w && cy2 > oy && cy1 < oy + o.h) return true;
  }
  return false;
}

// ── Game loop ─────────────────────────────────────────────────────────────
function loop() {
  if (state !== 'running') return;
  frame++;
  score += speed * 0.1;
  speed  = 3 + score / 400;

  updateCursor();
  updateObs();

  if (checkCollision()) {
    burst(CHAR_X + 4, cursor.y + 12, '#f85149');
    die();
  }

  draw();
  document.getElementById('scoreVal').textContent = Math.floor(score);
  document.getElementById('speedVal').textContent = speed.toFixed(1);
  requestAnimationFrame(loop);
}

function die() {
  state = 'dead';
  if (score > best) { best = Math.floor(score); localStorage.setItem('cr-best', best); }
  document.getElementById('bestVal').textContent = best;
  document.getElementById('finalScore').textContent = `SCORE: ${Math.floor(score)}${score > best ? '  🏆 NEW BEST!' : ''}`;
  document.getElementById('finalScore').style.display = 'block';
  document.getElementById('startBtn').textContent = '↺ RETRY';
  document.getElementById('overlay').style.display = 'flex';
  document.querySelector('#overlay h2').textContent = '💀 SEGFAULT';
  document.querySelector('#overlay p').textContent = '// undefined behavior detected';
}

function startGame() {
  state = 'running';
  score = 0; frame = 0; speed = 3;
  cursor.y = GROUND; cursor.vy = 0; cursor.jumps = 0;
  obstacles = []; obsTimer = 0; particles = [];
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('finalScore').style.display = 'none';
  document.getElementById('bestVal').textContent = best;
  loop();
}

// ── Input ─────────────────────────────────────────────────────────────────
document.getElementById('startBtn').addEventListener('click', startGame);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (state === 'running') jumpCursor(); }
});
canvas.addEventListener('click', () => { if (state === 'running') jumpCursor(); });
draw();
</script>
</body>
</html>
