<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trap.exe</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Cascadia Code','Consolas',monospace; color:#e6edf3; overflow:hidden; user-select:none; }
  #wrap { position:relative; }
  canvas { display:block; border:1px solid #30363d; border-radius:8px; image-rendering:pixelated; }
  #ui { display:flex; gap:28px; margin-bottom:10px; font-size:0.8rem; color:#8b949e; align-items:center; }
  #ui .val { font-weight:bold; }
  #ui .val.red   { color:#f85149; }
  #ui .val.green { color:#3fb950; }
  #ui .val.gold  { color:#e3b341; }
  #hint { font-size:0.7rem; color:#484f58; font-style:italic; max-width:600px; text-align:center; margin-bottom:6px; min-height:1em; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#0d111799; backdrop-filter:blur(2px); border-radius:8px; z-index:10; }
  #overlay h2 { font-size:1.8rem; color:#f85149; letter-spacing:3px; }
  #overlay p  { color:#8b949e; font-size:0.82rem; }
  .score-big { font-size:1.1rem; color:#e3b341; text-align:center; line-height:1.7; }
  .btn { background:#da3633; color:#fff; border:none; border-radius:6px; padding:10px 28px; font-family:inherit; font-size:0.9rem; cursor:pointer; letter-spacing:2px; }
  .btn:hover { background:#f85149; }
  #back { position:absolute; top:10px; left:10px; background:#21262d; color:#8b949e; border:1px solid #30363d; border-radius:6px; padding:5px 12px; font-family:inherit; font-size:0.75rem; cursor:pointer; z-index:20; }
  #back:hover { color:#e6edf3; border-color:#f85149; }
</style>
</head>
<body>
<button id="back" onclick="location.href='launcher.html'">← Games</button>
<div id="ui">
  <div>LEVEL <span class="val green" id="lvlVal">1/5</span></div>
  <div>DEATHS <span class="val red" id="deathVal">0</span></div>
  <div id="hint"></div>
</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2>💀 TRAP.EXE</h2>
    <p>// the floor is a liar. trust nothing.</p>
    <div class="score-big" id="finalMsg" style="display:none"></div>
    <button class="btn" id="startBtn">▶ START</button>
    <p style="font-size:0.7rem;color:#484f58">← → / A D · Space / ↑ / W to jump</p>
  </div>
</div>

<script>
'use strict';

// ─── Constants ────────────────────────────────────────────────────────────────
const TILE = 20;
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = canvas.width  = Math.min(window.innerWidth  - 60, 700);
const H = canvas.height = 360;
const VTILES = H / TILE;  // 18 rows

// Tile type IDs
const AIR=0, SOLID=1, CRUMBLE=2, FAKE=3, SPIKE_U=4, SPIKE_D=5,
      POP=6, BOUNCE=7, LAVA=8, GOAL=9;

// Physics
const GRAV=0.52, JUMP_V=-10.8, WALK=3.4, FRICTION=0.78;
const PW=11, PH=17; // player pixel size

// ─── Level Data ───────────────────────────────────────────────────────────────
// Key: # solid  . air  @ start  E exit
//      C crumble(looks=#)  F fake(looks=#)  P pop-spike(looks=#)
//      S spike-up  s spike-down  X lava  B bounce(looks=#,lighter)

const LEVEL_DATA = [
  {
    name: '"Hello, World!"',
    hint: '// a perfectly normal platformer. nothing suspicious here.',
    map: [
      '##################################################',
      '#@................................................#',
      '##.#####..........................................#',
      '#.......####......................................#',
      '#...........####..................................#',
      '#...............CCCC..............................#',
      '#...................####..........................#',
      '#.......................####......................#',
      '#...........................####.................#',
      '#...............................#................#',
      '#.................................#..............#',
      '#...................................#............#',
      '#.....................................#..........#',
      '#.......................................#........#',
      '#.........................................#......#',
      '#...........................................#....#',
      '#.............................................#.E#',
      '##################################################',
    ]
  },
  {
    name: '"null.pointer"',
    hint: '// are those platforms real? only one way to find out.',
    map: [
      '##################################################',
      '#@...........................s...........s.......#',
      '#.####...........................####...####.....#',
      '#......####......................#.............#..#',
      '#..........FFFF..................#.............####',
      '#..............FFFF..............#................#',
      '#..................SSSS...........#...............#',
      '#..................####...........#...............#',
      '#.................................#..SSSS..SSSS..#',
      '#.................................#..####..####..#',
      '#.................................FFFF...........#',
      '#............................................FFFF.#',
      '#.................................................#',
      '#......SSSS.....SSSS.....SSSS.....SSSS...........#',
      '#......####.....####.....####.....####...........#',
      '#.................................................#',
      '#................................................E#',
      '##################################################',
    ]
  },
  {
    name: '"stack_overflow.rs"',
    hint: '// bouncy! (the spikes above are fine, don\'t worry about them)',
    map: [
      '##################################################',
      '#s.s.s.s.s.s.s.s.s.s.s.s.s.s.s.s.s.s.s.s.s.s.s#',
      '#................................................#',
      '#@.......BBBB.....BBBB.....BBBB.....BBBB........#',
      '#........####.....####.....####.....####........#',
      '#................................................#',
      '#.CCCC...........CCCC...........CCCC............#',
      '#.####...........####...........####............#',
      '#................................................#',
      '#................................................#',
      '#................................................#',
      '#.......PPPP..........PPPP..........PPPP........#',
      '#.......####..........####..........####........#',
      '#................................................#',
      '#...SSSS.....SSSS.....SSSS.....SSSS.....SSSS...#',
      '#...####.....####.....####.....####.....####...#',
      '#...............................................E#',
      '##################################################',
    ]
  },
  {
    name: '"undefined_behavior.c"',
    hint: '// the compiler said it would be fine.',
    map: [
      '##################################################',
      '#@.......CCFF.CCFF.CCFF......s......s......s....#',
      '#.######.####.####.####.....###....###....###...#',
      '#.......................................PPPP.....#',
      '#.......................................####.....#',
      '#..SSSS..SSSS..SSSS........................FFFF..#',
      '#..####..####..####........................####..#',
      '#...............................................#',
      '#.....FFFFFF....FFFFFF....FFFFFF...............#',
      '#.....######....######....######...............#',
      '#...............................................#',
      '#.PPPP....PPPP....PPPP....PPPP.................#',
      '#.####....####....####....####.................#',
      '#..............................................##',
      '#.SSSSSSSSSSSS.....BBBB...........SSSS.........#',
      '#.##############...####...........####.........#',
      '#.....................................FFFFFF...E#',
      '##################################################',
    ]
  },
  {
    name: '"you_are_the_bug.exe"',
    hint: '// git blame: yourself. it was always you.',
    map: [
      '##################################################',
      '#s.....s.....s.....s.....s.....s.....s.....s...s#',
      '#@.............................................###',
      '#.CFPCFPCFPCFPCFPCFPCFPCFPCFPCFPCFPCFPCFPCFP...#',
      '#.##############################################',
      '#...............................................#',
      '#SSSSSSSS............................SSSSSSSS..#',
      '#########.......BBBB.BBBB...........##########.#',
      '#................####.####..............FFFFFF.#',
      '#.................................FFFFFF........#',
      '#.....PPPP.PPPP.PPPP...........................#',
      '#.....####.####.####...SSSS.....SSSS...........#',
      '#......................####.....####............#',
      '#...............................................#',
      '#...CCCC...FFFF...PPPP...CCCC...FFFF...PPPP....#',
      '#...####...####...####...####...####...####....#',
      '#...............................................E#',
      '##################################################',
    ]
  },
];

// ─── Parse Map ────────────────────────────────────────────────────────────────
function parseMap(rows) {
  const w = Math.max(...rows.map(r => r.length));
  let start = { x: TILE, y: TILE };
  const tiles = rows.map((row, ri) =>
    Array.from({ length: w }, (_, ci) => {
      const ch = row[ci] || ' ';
      if (ch === '@') { start = { x: ci * TILE + 1, y: ri * TILE - PH }; return AIR; }
      switch (ch) {
        case '#': return SOLID;
        case 'C': return CRUMBLE;
        case 'F': return FAKE;
        case 'S': return SPIKE_U;
        case 's': return SPIKE_D;
        case 'P': return POP;
        case 'B': return BOUNCE;
        case 'X': return LAVA;
        case 'E': return GOAL;
        default:  return AIR;
      }
    })
  );
  return { tiles, w, h: rows.length, start };
}

const LEVELS = LEVEL_DATA.map(d => ({ name: d.name, hint: d.hint, ...parseMap(d.map) }));

// ─── State ────────────────────────────────────────────────────────────────────
let state  = 'idle';
let lvlIdx = 0;
let deaths = 0;
let totalDeaths = 0;
let camX   = 0;
let revealT = 0;          // ms remaining in "reveal traps" flash
let particles = [];
let flashAlpha = 0;       // red-screen death flash

// Per-level dynamic tile state
let crumbles = {};   // `r,c` → { t: ms, falling: bool, fy: px }
let pops     = {};   // `r,c` → { t: ms, triggered: bool, popped: bool }

// Player
let p = {};
function resetPlayer() {
  const lvl = LEVELS[lvlIdx];
  p = { x: lvl.start.x, y: lvl.start.y, vx: 0, vy: 0, onGround: false, dead: false, jumpHeld: false };
  crumbles = {};
  pops     = {};
  camX     = 0;
}

// ─── Input ───────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  // Jump on press (not hold)
  if ((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') && !e.repeat) {
    if (state==='running' && p.onGround && !p.dead) {
      p.vy = JUMP_V;
      p.onGround = false;
    }
  }
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── Tile helpers ──────────────────────────────────────────────────────────
function getTile(lvl, r, c) {
  if (r < 0 || r >= lvl.h || c < 0 || c >= lvl.w) return SOLID;
  return lvl.tiles[r][c];
}

// Is this tile solid for physics? (considers crumble/fake/pop state)
function isSolid(lvl, r, c) {
  const t = getTile(lvl, r, c);
  if (t === SOLID || t === BOUNCE) return true;
  if (t === SPIKE_U || t === SPIKE_D) return false; // you die in them, not block
  if (t === CRUMBLE) {
    const s = crumbles[`${r},${c}`];
    return !s || !s.falling;
  }
  if (t === FAKE) return false;
  if (t === POP)  return true; // floor always solid; spike kills independently
  return false;
}

// Does touching this tile kill the player?
function isKill(lvl, r, c) {
  const t = getTile(lvl, r, c);
  if (t === SPIKE_U || t === SPIKE_D || t === LAVA) return true;
  if (t === POP) {
    const s = pops[`${r},${c}`];
    return s && s.popped;
  }
  return false;
}

function isGoal(lvl, r, c) { return getTile(lvl, r, c) === GOAL; }

// ─── Physics ─────────────────────────────────────────────────────────────────
function updatePlayer(dt) {
  if (p.dead) return;
  const lvl = LEVELS[lvlIdx];

  // Horizontal input
  if (keys['ArrowLeft']  || keys['KeyA']) p.vx -= 1.1;
  if (keys['ArrowRight'] || keys['KeyD']) p.vx += 1.1;
  p.vx *= FRICTION;
  p.vx = Math.max(-WALK, Math.min(WALK, p.vx));

  // Gravity
  p.vy += GRAV;
  p.vy = Math.min(p.vy, 14); // terminal velocity

  // Resolve movement in two passes (X then Y)
  let nx = p.x + p.vx;
  let ny = p.y + p.vy;
  p.onGround = false;

  // ── Y resolution ──
  if (p.vy >= 0) {
    // Falling down — check feet
    const footY  = ny + PH;
    const footR  = Math.floor(footY / TILE);
    const left   = Math.floor((nx + 1) / TILE);
    const right  = Math.floor((nx + PW - 2) / TILE);
    let hitFloor = false;
    for (let c = left; c <= right; c++) {
      if (isSolid(lvl, footR, c) && (p.y + PH) <= footR * TILE + 1) {
        // Land on tile
        ny = footR * TILE - PH;
        p.vy = 0;
        p.onGround = true;
        hitFloor = true;

        // Activate crumble
        const key = `${footR},${c}`;
        if (getTile(lvl, footR, c) === CRUMBLE && !crumbles[key]) {
          crumbles[key] = { t: 0, falling: false, fy: footR * TILE };
        }
        // Bounce pad — fling!
        if (getTile(lvl, footR, c) === BOUNCE) {
          p.vy = -15;
          p.onGround = false;
        }
        break;
      }
    }
  } else {
    // Moving up — check head
    const headR = Math.floor(ny / TILE);
    const left  = Math.floor((nx + 1) / TILE);
    const right = Math.floor((nx + PW - 2) / TILE);
    for (let c = left; c <= right; c++) {
      if (isSolid(lvl, headR, c) && p.y >= (headR + 1) * TILE - 1) {
        ny = (headR + 1) * TILE;
        p.vy = 0;
        break;
      }
    }
  }

  // ── X resolution ──
  const topR    = Math.floor((ny + 2) / TILE);
  const botR    = Math.floor((ny + PH - 2) / TILE);
  if (p.vx > 0) {
    const rightC = Math.floor((nx + PW) / TILE);
    for (let r = topR; r <= botR; r++) {
      if (isSolid(lvl, r, rightC) && p.x + PW <= rightC * TILE + 1) {
        nx = rightC * TILE - PW; p.vx = 0; break;
      }
    }
  } else if (p.vx < 0) {
    const leftC = Math.floor(nx / TILE);
    for (let r = topR; r <= botR; r++) {
      if (isSolid(lvl, r, leftC) && p.x >= (leftC + 1) * TILE - 1) {
        nx = (leftC + 1) * TILE; p.vx = 0; break;
      }
    }
  }

  p.x = nx;
  p.y = ny;

  // ── Kill checks ──
  const rows = [Math.floor((p.y + 2) / TILE),     Math.floor((p.y + PH - 2) / TILE)];
  const cols = [Math.floor((p.x + 2) / TILE),     Math.floor((p.x + PW - 2) / TILE)];
  for (const r of rows) for (const c of cols) {
    if (isKill(lvl, r, c)) { die(); return; }
    if (isGoal(lvl, r, c)) { winLevel(); return; }
  }

  // ── Fell off screen ──
  if (p.y > lvl.h * TILE + 80) { die(); return; }
}

// ─── Trap Updates ─────────────────────────────────────────────────────────────
function updateTraps(dt) {
  const lvl = LEVELS[lvlIdx];

  // Crumble
  for (const key in crumbles) {
    const s = crumbles[key];
    s.t += dt;
    if (!s.falling && s.t > 400) { s.falling = true; }
    if (s.falling) {
      s.fy = (s.fy || parseInt(key.split(',')[0]) * TILE) + 6;
    }
  }

  // Pop spikes — trigger when player is within 3 tiles of a pop tile
  for (let r = 0; r < lvl.h; r++) {
    for (let c = 0; c < lvl.w; c++) {
      if (getTile(lvl, r, c) !== POP) continue;
      const key = `${r},${c}`;
      if (!pops[key]) pops[key] = { t: 0, triggered: false, popped: false };
      const s = pops[key];
      if (!s.triggered) {
        // Trigger if player stands on same row or row above
        const pr = Math.floor((p.y + PH) / TILE);
        const pc = Math.floor((p.x + PW/2) / TILE);
        if (!p.dead && Math.abs(r - pr) <= 1 && Math.abs(c - pc) <= 4) {
          s.triggered = true;
        }
      }
      if (s.triggered && !s.popped) {
        s.t += dt;
        if (s.t > 700) s.popped = true;
      }
    }
  }
}

// ─── Death / Win ───────────────────────────────────────────────────────────
function die() {
  if (p.dead) return;
  p.dead = true;
  deaths++;
  totalDeaths++;
  document.getElementById('deathVal').textContent = deaths;
  flashAlpha = 0.6;
  revealT = 1800;
  burst(p.x + PW/2, p.y + PH/2, '#f85149', 14);
  setTimeout(() => { if (state === 'running') resetPlayer(); }, 1800);
}

function winLevel() {
  if (state !== 'running') return;
  state = 'levelwin';
  burst(p.x + PW/2, p.y + PH/2, '#3fb950', 20);
  setTimeout(() => {
    lvlIdx++;
    if (lvlIdx >= LEVELS.length) {
      state = 'gameover';
      showOverlay('🏆 ESCAPED!', `// all ${LEVELS.length} levels cleared\nTotal deaths: ${deaths}`, '↺ PLAY AGAIN');
    } else {
      deaths = 0;
      resetPlayer();
      updateHintUI();
      state = 'running';
    }
  }, 1000);
}

// ─── Particles ───────────────────────────────────────────────────────────────
function burst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 + Math.random() * 0.5;
    const spd   = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd - 2,
                      life: 1, size: 2 + Math.random()*3, color });
  }
}

// ─── Camera ───────────────────────────────────────────────────────────────────
function updateCamera() {
  const lvl  = LEVELS[lvlIdx];
  const maxX = lvl.w * TILE - W;
  const target = p.x + PW/2 - W * 0.4;
  camX += (Math.max(0, Math.min(maxX, target)) - camX) * 0.12;
}

// ─── Draw ────────────────────────────────────────────────────────────────────
const SOLID_COLOR  = '#1e4a2e';
const SOLID_TOP    = '#2d6a40';
const SPIKE_COLOR  = '#f85149';
const GOAL_COLOR   = '#3fb950';
const LAVA_COLOR   = '#e3b341';
const BOUNCE_COLOR = '#2a6040';  // slightly lighter — subtle hint
const BOUNCE_TOP   = '#3a8050';

// True colors revealed after death
const REVEAL = {
  [CRUMBLE]: '#e3b341',
  [FAKE]:    '#58a6ff',
  [POP]:     '#f85149',
  [BOUNCE]:  '#79c0ff',
};

function drawTile(t, px, py, revealing, phase) {
  switch (t) {
    case SOLID:
      ctx.fillStyle = SOLID_COLOR; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = SOLID_TOP;   ctx.fillRect(px, py, TILE, 3);
      break;

    case CRUMBLE:
      if (revealing) {
        ctx.fillStyle = REVEAL[CRUMBLE]; ctx.globalAlpha = 0.5 + Math.sin(phase*8)*0.3;
        ctx.fillRect(px, py, TILE, TILE); ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = SOLID_COLOR; ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = SOLID_TOP;   ctx.fillRect(px, py, TILE, 3);
        // Subtle crack lines (only visible if you look carefully)
        ctx.strokeStyle = '#1a3a25'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(px+5, py+6); ctx.lineTo(px+9, py+14); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px+13, py+5); ctx.lineTo(px+10, py+15); ctx.stroke();
      }
      break;

    case FAKE:
      if (revealing) {
        ctx.fillStyle = REVEAL[FAKE]; ctx.globalAlpha = 0.5 + Math.sin(phase*8)*0.3;
        ctx.fillRect(px, py, TILE, TILE); ctx.globalAlpha = 1;
      } else {
        // Identical to solid — that's the trick
        ctx.fillStyle = SOLID_COLOR; ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = SOLID_TOP;   ctx.fillRect(px, py, TILE, 3);
      }
      break;

    case POP: {
      if (revealing) {
        ctx.fillStyle = REVEAL[POP]; ctx.globalAlpha = 0.5 + Math.sin(phase*8)*0.3;
        ctx.fillRect(px, py, TILE, TILE); ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = SOLID_COLOR; ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = SOLID_TOP;   ctx.fillRect(px, py, TILE, 3);
        // Tiny dot hint
        ctx.fillStyle = '#f8514930';
        ctx.beginPath(); ctx.arc(px+10, py+12, 1.5, 0, Math.PI*2); ctx.fill();
      }
      break;
    }

    case BOUNCE:
      if (revealing) {
        ctx.fillStyle = REVEAL[BOUNCE]; ctx.globalAlpha = 0.5 + Math.sin(phase*8)*0.3;
        ctx.fillRect(px, py, TILE, TILE); ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = BOUNCE_COLOR; ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = BOUNCE_TOP;   ctx.fillRect(px, py, TILE, 3);
        // Small chevrons indicate bounce
        ctx.strokeStyle = '#4a9060'; ctx.lineWidth = 1.2;
        for (let i = 0; i < 2; i++) {
          const oy = py + 7 + i * 5;
          ctx.beginPath(); ctx.moveTo(px+3, oy+3); ctx.lineTo(px+10, oy); ctx.lineTo(px+17, oy+3); ctx.stroke();
        }
      }
      break;

    case SPIKE_U: {
      ctx.fillStyle = SPIKE_COLOR;
      const sx = px + 1, sw = TILE - 2;
      for (let i = 0; i < 3; i++) {
        const tx = sx + i * (sw/3);
        ctx.beginPath(); ctx.moveTo(tx, py+TILE); ctx.lineTo(tx+sw/6, py+3); ctx.lineTo(tx+sw/3, py+TILE); ctx.fill();
      }
      break;
    }

    case SPIKE_D: {
      ctx.fillStyle = SPIKE_COLOR;
      const sx = px + 1, sw = TILE - 2;
      for (let i = 0; i < 3; i++) {
        const tx = sx + i * (sw/3);
        ctx.beginPath(); ctx.moveTo(tx, py); ctx.lineTo(tx+sw/6, py+TILE-3); ctx.lineTo(tx+sw/3, py); ctx.fill();
      }
      break;
    }

    case LAVA: {
      const t2 = Date.now() / 800;
      ctx.fillStyle = '#c07010'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = LAVA_COLOR;
      for (let i = 0; i < 3; i++) {
        const bx = px + i * 7;
        const bh = 3 + Math.sin(t2 + i * 2.1) * 3;
        ctx.beginPath(); ctx.ellipse(bx+4, py+2, 3, bh, 0, 0, Math.PI*2); ctx.fill();
      }
      break;
    }

    case GOAL: {
      ctx.fillStyle = '#0f2a18'; ctx.fillRect(px, py, TILE, TILE);
      const pulse = 0.7 + Math.sin(Date.now()/300)*0.3;
      ctx.fillStyle = GOAL_COLOR; ctx.globalAlpha = pulse;
      ctx.font = `bold ${TILE-2}px monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('E', px + TILE/2, py + TILE/2);
      ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      break;
    }
  }
}

function drawPoppedSpike(px, py) {
  ctx.fillStyle = SPIKE_COLOR;
  ctx.beginPath(); ctx.moveTo(px+3, py+TILE); ctx.lineTo(px+10, py+2); ctx.lineTo(px+17, py+TILE); ctx.fill();
}

let lastT = 0, phase = 0;
function draw(now) {
  const dt = Math.min(now - lastT, 40); lastT = now;
  phase = now / 1000;

  if (state === 'idle' || state === 'gameover') { ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H); return; }

  // Fade in
  const revealing = revealT > 0;
  if (revealing) revealT = Math.max(0, revealT - dt);

  // Update
  if (state === 'running' && !p.dead) {
    updatePlayer(dt);
    updateTraps(dt);
    updateCamera();
  }
  if (state === 'levelwin' && !p.dead) updateCamera();

  // BG
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle = '#111820'; ctx.lineWidth = 1;
  for (let x = -camX % TILE; x < W; x += TILE) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += TILE) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Tiles
  const lvl = LEVELS[lvlIdx];
  const startC = Math.max(0, Math.floor(camX / TILE) - 1);
  const endC   = Math.min(lvl.w, startC + Math.ceil(W/TILE) + 2);

  for (let r = 0; r < lvl.h; r++) {
    for (let c = startC; c < endC; c++) {
      const t  = lvl.tiles[r][c];
      if (t === AIR) continue;
      const px = c * TILE - camX;
      const py = r * TILE;

      // Crumble animation
      if (t === CRUMBLE) {
        const s = crumbles[`${r},${c}`];
        if (s && s.falling) {
          // Draw falling tile at offset
          const fallPx = py + (s.fy - r * TILE);
          if (fallPx < H) { ctx.save(); ctx.translate(0, fallPx - py); drawTile(t, px, py, revealing, phase); ctx.restore(); }
          continue;
        }
        if (s && !s.falling) {
          // Shaking effect before falling
          const shake = Math.sin(phase * 30) * (s.t / 100);
          ctx.save(); ctx.translate(shake, 0); drawTile(t, px, py, revealing, phase); ctx.restore();
          continue;
        }
      }

      // Pop spike — show popped spike on top
      if (t === POP) {
        const s = pops[`${r},${c}`];
        drawTile(t, px, py, revealing, phase);
        if (s && s.popped) {
          drawPoppedSpike(px, py - TILE);
        } else if (s && s.triggered && !s.popped) {
          // Show warning: tiny red tip appearing
          const prog = s.t / 700;
          ctx.fillStyle = SPIKE_COLOR; ctx.globalAlpha = prog;
          ctx.beginPath(); ctx.moveTo(px+5, py); ctx.lineTo(px+10, py-8*prog); ctx.lineTo(px+15, py); ctx.fill();
          ctx.globalAlpha = 1;
        }
        continue;
      }

      drawTile(t, px, py, revealing, phase);
    }
  }

  // Player
  if (!p.dead) {
    const px = Math.round(p.x - camX);
    const py = Math.round(p.y);
    // Body
    const blink = p.dead ? false : Math.floor(phase * 8) % 2 === 0;
    ctx.fillStyle = blink ? '#79c0ff' : '#58a6ff';
    ctx.fillRect(px, py, PW, PH);
    // Visor
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(px+2, py+4, 7, 4);
    // Glow
    ctx.shadowColor = '#58a6ff'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#58a6ff22';
    ctx.fillRect(px-2, py-2, PW+4, PH+4);
    ctx.shadowBlur = 0;
    // Feet
    ctx.fillStyle = '#3a8aff';
    ctx.fillRect(px, py+PH-3, 4, 3);
    ctx.fillRect(px+PW-4, py+PH-3, 4, 3);
  }

  // Particles
  particles = particles.filter(pt => pt.life > 0);
  particles.forEach(pt => {
    ctx.fillStyle = pt.color + Math.floor(pt.life * 220).toString(16).padStart(2,'0');
    ctx.beginPath(); ctx.arc(pt.x - camX, pt.y, pt.size * pt.life, 0, Math.PI*2); ctx.fill();
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.2; pt.life -= 0.04;
  });

  // Death flash
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(248,81,73,${flashAlpha})`;
    ctx.fillRect(0,0,W,H);
    flashAlpha = Math.max(0, flashAlpha - 0.04);
  }

  // Level name watermark
  ctx.fillStyle = '#58a6ff06';
  ctx.font = `bold ${H*0.4}px monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(lvlIdx + 1, W/2, H/2);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  // Level win flash
  if (state === 'levelwin') {
    ctx.fillStyle = `rgba(63,185,80,0.15)`;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#3fb950'; ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ESCAPED! →', W/2, H/2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  requestAnimationFrame(draw);
}

// ─── UI ──────────────────────────────────────────────────────────────────────
function showOverlay(title, body, btnText) {
  document.querySelector('#overlay h2').textContent = title;
  document.querySelector('#overlay p').textContent  = body;
  document.getElementById('startBtn').textContent   = btnText || '▶ START';
  document.getElementById('overlay').style.display  = 'flex';
  state = 'idle';
}

function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

function updateHintUI() {
  const lvl = LEVELS[lvlIdx];
  document.getElementById('hint').textContent   = lvl.hint;
  document.getElementById('lvlVal').textContent = `${lvlIdx+1}/${LEVELS.length}`;
}

function startGame() {
  lvlIdx = 0; deaths = 0; totalDeaths = 0;
  particles = [];
  document.getElementById('deathVal').textContent = 0;
  resetPlayer();
  updateHintUI();
  hideOverlay();
  state = 'running';
  lastT = performance.now();
  requestAnimationFrame(draw);
}

document.getElementById('startBtn').addEventListener('click', () => {
  if (state === 'gameover') {
    document.getElementById('finalMsg').style.display = 'none';
    startGame();
  } else {
    startGame();
  }
});

// Idle draw
ctx.fillStyle = '#0d1117'; ctx.fillRect(0,0,W,H);
</script>
</body>
</html>
