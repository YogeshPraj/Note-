<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Sticky</title>
  <style>
    :root {
      --sticky-bg: #fef3a8;
      --sticky-fg: #4a3f00;
      --sticky-accent: #e8d24a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--sticky-bg);
      color: var(--sticky-fg);
      overflow: hidden;
      user-select: none;
    }
    body { display: flex; flex-direction: column; }

    /* Drag handle — the whole header moves the window (frameless). */
    #sticky-header {
      -webkit-app-region: drag;
      display: flex; align-items: center; gap: 4px;
      padding: 6px 6px 4px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--sticky-accent) 60%, transparent);
    }
    #sticky-grip {
      flex: 1; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      opacity: 0.45; font-weight: 600; overflow: hidden; white-space: nowrap;
    }
    .sticky-btn {
      -webkit-app-region: no-drag;
      width: 20px; height: 20px; flex-shrink: 0;
      border: none; background: transparent; cursor: pointer;
      color: var(--sticky-fg); opacity: 0.55;
      border-radius: 3px; font-size: 13px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit;
    }
    .sticky-btn:hover { opacity: 1; background: color-mix(in srgb, var(--sticky-accent) 55%, transparent); }

    /* Colour swatch row — hidden until the palette button is clicked. */
    #sticky-palette {
      -webkit-app-region: no-drag;
      display: none; gap: 5px; padding: 6px 10px;
      border-bottom: 1px solid color-mix(in srgb, var(--sticky-accent) 60%, transparent);
    }
    #sticky-palette.open { display: flex; }
    .swatch {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.12); cursor: pointer; padding: 0;
    }
    .swatch.active { border-color: rgba(0,0,0,0.55); }

    #sticky-body {
      -webkit-app-region: no-drag;
      flex: 1; display: flex; flex-direction: column;
      padding: 8px 10px 10px; gap: 6px; min-height: 0;
    }
    #sticky-title {
      font-size: 14px; font-weight: 600; line-height: 1.3;
      border: none; background: transparent; color: inherit;
      resize: none; outline: none; font-family: inherit;
      user-select: text; overflow: hidden; flex-shrink: 0;
    }
    #sticky-title.done { text-decoration: line-through; opacity: 0.5; }
    #sticky-notes {
      flex: 1; font-size: 12px; line-height: 1.5;
      border: none; background: transparent; color: inherit;
      resize: none; outline: none; font-family: inherit;
      user-select: text; opacity: 0.85; min-height: 0;
    }
    #sticky-notes::placeholder { opacity: 0.35; }

    #sticky-footer {
      flex-shrink: 0; display: flex; align-items: center; gap: 6px;
      font-size: 10px; opacity: 0.6; padding-top: 4px;
      border-top: 1px solid color-mix(in srgb, var(--sticky-accent) 45%, transparent);
    }
    #sticky-due { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #sticky-due.overdue { color: #b32d24; opacity: 1; font-weight: 600; }
    #sticky-source { opacity: 0.7; font-style: italic; }
  </style>
</head>
<body>
  <div id="sticky-header">
    <div id="sticky-grip">Sticky</div>
    <button class="sticky-btn" id="btn-done"    title="Mark done">✓</button>
    <button class="sticky-btn" id="btn-palette" title="Change colour">◑</button>
    <button class="sticky-btn" id="btn-close"   title="Close (task is kept)">×</button>
  </div>
  <div id="sticky-palette"></div>
  <div id="sticky-body">
    <textarea id="sticky-title" rows="2" placeholder="Task title…"></textarea>
    <textarea id="sticky-notes" placeholder="Notes…"></textarea>
    <div id="sticky-footer">
      <span id="sticky-due"></span>
      <span id="sticky-source"></span>
    </div>
  </div>

  <script src="sticky.js"></script>
</body>
</html>
