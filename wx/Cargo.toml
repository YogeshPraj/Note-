# A workspace of its own: this build needs the GCC 15.1 toolchain that wxWidgets' prebuilt libraries
# were made with (see README.md), unlike the portable core at the repository root.
[workspace]
resolver = "2"
members = ["crates/ui-kit", "crates/app"]

[workspace.package]
version = "2.0.8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
too_many_lines = "warn"
# Style lints that cost more than they give here (decision logged in docs/decisions.md).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
assert_is_empty = "allow"
trivially_copy_pass_by_ref = "allow"
wildcard_imports = "allow"
format_push_string = "allow"
many_single_char_names = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Our copy adds GetDirectFunction/GetDirectPointer (raw Scintilla access) to the STC glue.
[patch.crates-io]
wxdragon-sys = { path = "../vendor/wxdragon-sys" }

# Release: one optimised, stripped binary (about a third of the unstripped size). Panics stay unwinding: wxdragon catches them in UI callbacks.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# Key derivation is slow unoptimised; keep the tests quick.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
