[package]
name = "notepp-wx"
version.workspace = true
edition = "2024"
description = "Note++ with a wxWidgets shell (native widgets on Windows, macOS and Linux)"

[[bin]]
name = "notepp-wx"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
notepp-core = { path = "../../../crates/core" }
ui-kit = { path = "../ui-kit" }
# Default features also build TIFF/JPEG/XPM and Tango icon support, wx printing (printing goes through the web view) and appindicator.
wxdragon = { version = "0.9", default-features = false, features = ["stc", "webview", "aui", "wx-regex", "wx-asserts"] }
wxdragon-sys = "0.9"
zeroize = "1"
sha2 = "0.10"
encoding_rs = "0.8.42"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
